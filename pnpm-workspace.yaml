packages:
  - "packages/*"

allowBuilds:
  esbuild: true
  # Optional native accel for msgpackr (BullMQ dep); the pure-JS fallback is fine.
  msgpackr-extract: false

# esbuild backs tsx and vitest; allow its install script to run.
# (pnpm 11 reads build-script approvals here, not from package.json.)
onlyBuiltDependencies:
  - esbuild

# Security floor for transitive packages (TASK-051): versions below these carry published
# advisories (pnpm audit, 2026-09-30) and the packages that pull them in have not yet raised
# their own ranges. Each override stays inside the range the parent asked for, so nothing
# changes behaviour except the fix. Remove a line once `pnpm audit --prod` stays clean without it.
overrides:
  "fast-uri@>=3.0.0 <3.1.8": "^3.1.8"
  "fast-uri@>=4.0.0 <4.1.5": "^4.1.5"
  "brace-expansion@>=4.0.0 <5.0.12": "^5.0.12"
