openapi: 3.0.1
info:
  title: Data-streaming/Cash-collections
  description: API operations related to Cash-collections
  version: 1.9.0-4-SNAPSHOT
servers:
  - url: https://uat-api.televendcloud.com/televend-api
    description: Televend API Gateway
tags:
  - name: Streaming Control
    description: API operations aimed to control data streaming
  - name: Cash Collection
    description: Operations for data streaming of cash collections
paths:
  /data-streaming/{dataType}/api/v1/offsets:
    get:
      tags:
        - Streaming Control
      summary: Get the last committed offsets for all partitions
      operationId: getOffsets
      parameters:
        - name: dataType
          in: path
          description: Type of data for which this streaming control API operation is called
          required: true
          schema:
            type: string
          example: vends
        - name: demoMode
          in: query
          description: If any API operation (where demoMode is supported) is called with demoMode=true, then it refers to operation over example data for demo purposes only. Note that example data contains dummy values, not relevant for business, but technically valid. So it is a good way for a client application to be tested against real data structure as well as demo mode contains exact behaviour like dealing with real data (when demoMode=false)
          required: false
          schema:
            type: boolean
            default: false
          example: true
        - name: Authorization
          in: header
          description: JWT access token for authentication/authorization. Token type is 'Bearer'
          required: true
          schema:
            type: string
          example: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI.gOiAiSldUIiwia2lkIiA6ICJIZWtNRnBTS05Uak80V3JEcU5qTWZHNU5BMEdkUjR5Ym.FSaXZiMUtWT09RIn0
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Offset"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError"
    post:
      tags:
        - Streaming Control
      summary: Commit offsets for all partitions that have been fetched so far (by calling /records API operation) for the selected dataType
      operationId: commitOffsets
      parameters:
        - name: dataType
          in: path
          description: Type of data for which this streaming control API operation is called
          required: true
          schema:
            type: string
          example: vends
        - name: demoMode
          in: query
          description: If any API operation (where demoMode is supported) is called with demoMode=true, then it refers to operation over example data for demo purposes only. Note that example data contains dummy values, not relevant for business, but technically valid. So it is a good way for a client application to be tested against real data structure as well as demo mode contains exact behaviour like dealing with real data (when demoMode=false)
          required: false
          schema:
            type: boolean
            default: false
          example: true
        - name: Authorization
          in: header
          description: JWT access token for authentication/authorization. Token type is 'Bearer'
          required: true
          schema:
            type: string
          example: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI.gOiAiSldUIiwia2lkIiA6ICJIZWtNRnBTS05Uak80V3JEcU5qTWZHNU5BMEdkUjR5Ym.FSaXZiMUtWT09RIn0
      responses:
        "204":
          description: No content
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError"
  /data-streaming/{dataType}/api/v1/offsets/reset:
    post:
      tags:
        - Streaming Control
      summary: Reset offsets for selected dataType. Reset means moving offsets back or forth
      description: Be aware this API operation has impact what will return subsequent calls to /records API operation!!! For example if your application already fetched 100000 messages and currently has zero messages behind. Then this operation is called with resetType=EARLIEST, that means your application will be 100000 messages behind. And subsequent calls to /records API operation will return 100000 messages in overall in order to catch up again to the latest offsets (of course several subsequent calls to /records API operation will be required, not just one)
      operationId: resetOffsets
      parameters:
        - name: dataType
          in: path
          description: Type of data for which this streaming control API operation is called
          required: true
          schema:
            type: string
          example: vends
        - name: resetType
          in: query
          description: "Specify which type of reset is requested.\r

            \ EARLIEST: positions data consuming to the earliest message available (body is ignored, if provided). LATEST: positions data consuming to the latest new message that will arrive right after execution of this API operation (body is ignored, if provided).\ 

            \ OFFSET: positions data consuming to the specific offset somewhere in the middle as requested by the values in the body of the request (this type requires body to be provided that contains exactly specified offset values per partitions)"
          required: true
          schema:
            type: string
            enum:
              - EARLIEST
              - LATEST
              - OFFSET
          example: EARLIEST
        - name: demoMode
          in: query
          description: If any API operation (where demoMode is supported) is called with demoMode=true, then it refers to operation over example data for demo purposes only. Note that example data contains dummy values, not relevant for business, but technically valid. So it is a good way for a client application to be tested against real data structure as well as demo mode contains exact behaviour like dealing with real data (when demoMode=false)
          required: false
          schema:
            type: boolean
            default: false
          example: true
        - name: Authorization
          in: header
          description: JWT access token for authentication/authorization. Token type is 'Bearer'
          required: true
          schema:
            type: string
          example: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI.gOiAiSldUIiwia2lkIiA6ICJIZWtNRnBTS05Uak80V3JEcU5qTWZHNU5BMEdkUjR5Ym.FSaXZiMUtWT09RIn0
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/OffsetReset"
      responses:
        "204":
          description: No content
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError"
  /data-streaming/cash-collections/api/v1/records:
    get:
      tags:
        - Cash Collection
      summary: Fetch collection of new cash collection records that have come up meanwhile after a previous call of this API operation
      operationId: fetchCashCollectionRecords
      parameters:
        - name: demoMode
          in: query
          description: If any API operation (where demoMode is supported) is called with demoMode=true, then it refers to operation over example data for demo purposes only. Note that example data contains dummy values, not relevant for business, but technically valid. So it is a good way for a client application to be tested against real data structure as well as demo mode contains exact behaviour like dealing with real data (when demoMode=false)
          required: false
          schema:
            type: boolean
            default: false
          example: true
        - name: Authorization
          in: header
          description: JWT access token for authentication/authorization. Token type is 'Bearer'
          required: true
          schema:
            type: string
          example: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI.gOiAiSldUIiwia2lkIiA6ICJIZWtNRnBTS05Uak80V3JEcU5qTWZHNU5BMEdkUjR5Ym.FSaXZiMUtWT09RIn0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataStreamingResponseCashCollection"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError"
        "406":
          description: Not Acceptable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError"
components:
  schemas:
    ApplicationError:
      type: object
      properties:
        code:
          type: integer
          format: int32
        codeType:
          type: string
        error:
          type: string
        cause:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        tracingId:
          type: string
        errorType:
          type: string
          enum:
            - CLIENT_ERROR
            - CLIENT_ERROR_UNRESOLVABLE
            - CLIENT_ERROR_EXPIRED
            - CLIENT_ERROR_BUG
            - CLIENT_ERROR_BUG_EXPIRED
            - CLIENT_ERROR_BUG_UNRESOLVABLE
            - SERVER_ERROR_EXT
            - SERVER_ERROR_INT
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      properties:
        fieldName:
          type: string
        rejectedValue:
          type: string
        message:
          type: string
    OffsetReset:
      type: object
      properties:
        partition:
          type: integer
          format: int32
        offset:
          type: integer
          format: int64
    Offset:
      type: object
      properties:
        dataType:
          type: string
        partition:
          type: integer
          format: int32
        offset:
          type: integer
          format: int64
        earliestOffset:
          type: integer
          format: int64
        latestOffset:
          type: integer
          format: int64
        messagesBehind:
          type: integer
          format: int64
        messagesCount:
          type: integer
          format: int64
    CashCollection:
      required:
        - auditId
        - auditNumber
        - auditNumberTotal
        - company
        - correlationId
        - inducedBy
        - receivingTime
        - timestamp
        - version
      type: object
      properties:
        correlationId:
          maxLength: 40
          minLength: 12
          type: string
          description: Unique correlation ID of this message in the TelevendCloud
          example: 23QPV2V5THQ87W
        version:
          minimum: 1
          type: integer
          description: Every very first original message has version 1. If the same message needs to be updated due to any reason every subsequent update of it will have version 2, 3, 4 and so on. In case updated versions are not desired, then a client application  may use this parameter to process only messages with version=1. Any subsequent vesions may be discarded in such case.
          format: int64
          example: 4
          default: 1
        timestamp:
          type: string
          description: |-
            ISO date and time when the transaction or event occurred in the machine or device or in the system 
            NOTE1: this is NOT time of sending the request, but the very first time of occurence
          format: date-time
          example: 2023-06-17T17:33:27.902+02:00
        receivingTime:
          type: string
          description: Date and time when a message has been received by Televend Cloud if applicable. Otherwise it matches the same time as 'timestamp' field
          format: date-time
          example: 2023-06-17T17:33:28.406+02:00
        machine:
          $ref: "#/components/schemas/MachineInfo"
        company:
          $ref: "#/components/schemas/CompanyInfo"
        userInfo:
          $ref: "#/components/schemas/UserInfo"
        auditId:
          type: integer
          description: Unique identification for each cash collection record.
          format: int64
          example: 9876481293
        auditNumber:
          type: integer
          description: Sequence counter of Cash Collection per Machine per Induced by type.
          format: int64
          example: 12
        auditNumberTotal:
          type: integer
          description: Sequence counter of Cash collection per machine (regardless of type)
          format: int64
          example: 118
        inducedBy:
          type: string
          example: INITIAL_CASH_COLLECTION
          enum:
            - DATA_COLLECTION
            - CASH_COLLECTION
            - CASH_SNAPSHOT
            - INITIAL_CASH_COLLECTION
        routeInfo:
          $ref: "#/components/schemas/RouteInfo"
        collection:
          $ref: "#/components/schemas/Collection"
        filling:
          $ref: "#/components/schemas/Filling"
        cashIncome:
          $ref: "#/components/schemas/CashIncome"
        cashLeftInMachine:
          $ref: "#/components/schemas/CashLeftInMachine"
        fillMoney:
          $ref: "#/components/schemas/FillMoney"
        machineCashflow:
          $ref: "#/components/schemas/MachineCashflow"
        cashlessSales:
          $ref: "#/components/schemas/CashlessSales"
        attributes:
          type: object
          additionalProperties:
            type: object
            description: A map of additional attributes used for specific business requirements. All attributes from the map will be propagated through the whole processing chain just like other fields of this object
            example:
              paramInteger: 12
              paramString: some text
              paramBoolean: true
              paramNull: null
              paramComplex:
                name: John Smith
                color: blue
          description: A map of additional attributes used for specific business requirements. All attributes from the map will be propagated through the whole processing chain just like other fields of this object
          example:
            paramInteger: 12
            paramString: some text
            paramBoolean: true
            paramNull: null
            paramComplex:
              name: John Smith
              color: blue
    CashIncome:
      required:
        - cash1RechargeAmount
        - cash2RechargeAmount
        - cash3RechargeAmount
        - cashSalesAmount
        - cashlessRevaluationAmount
        - cashlessSalesTotalAmount
        - overpayAmount
        - totalAmount
      type: object
      properties:
        cashSalesAmount:
          type: number
          description: Sum value of all vends with payment type = Cash, that was reported to the cloud since the last cash collection.
          example: 1.56
        cash1RechargeAmount:
          type: number
          description: Sum of total topup to cashless 1 payment device
          example: 1.56
        cash2RechargeAmount:
          type: number
          description: Sum of total topup to cashless 2 payment device
          example: 1.56
        cash3RechargeAmount:
          type: number
          description: Sum of total topup to cashless 3 payment device
          example: 1.56
        overpayAmount:
          type: number
          description: "[Overpay] SUM value of all overpays (cash credits) left on the machine display since the last cash collection. Note: Overpay is unused cash credit because the machine could not return it due to coiner low tube status."
          example: 1.56
        cashlessRevaluationAmount:
          type: number
          description: "[Cashless revaluation] = [Cashless revaluation] + [Cashless 2 revaluation] + [Cashless 3 revaluation] Sum value of all Cashless revaluations since last cash collection."
          example: 1.56
        cashlessSalesTotalAmount:
          type: number
          description: "[Cashless sale] = [Cashless] + [Cashless 2] + [Cashless 3] Sum value of all vends with payment type = Cashless, that were reported to cloud since last cash collection."
          example: 1.56
        totalAmount:
          type: number
          description: Sum value of cashSales + cash1Recharge + cash2Recharge + cash3Recharge + Overpay
          example: 1.56
      description: Cash income
    CashLeftInMachine:
      required:
        - totalAmount
      type: object
      properties:
        insideCoinTubes:
          $ref: "#/components/schemas/TotalWithDenomination"
        totalAmount:
          type: number
          description: "[Cash Left in the Machine] Sum value of coins that were reported in the coiner tubes at the moment of the cash collection."
          example: 1.56
      description: Cash left in machine
    CashlessSales:
      required:
        - cashless1OverPayAmount
        - cashless1SalesAmount
        - cashless2OverPayAmount
        - cashless2SalesAmount
        - cashless3OverPayAmount
        - cashless3SalesAmount
        - tWalletSalesAmount
        - totalAmount
        - vendTokenSalesAmount
      type: object
      properties:
        tWalletSalesAmount:
          type: number
          description: Total wallet sales since last cash collection
          example: 1.56
        cashless1SalesAmount:
          type: number
          description: Total cashless 1 sales since last cash collection
          example: 1.56
        cashless2SalesAmount:
          type: number
          description: Total cashless 2 sales since last cash collection
          example: 1.56
        cashless3SalesAmount:
          type: number
          description: Total cashless 3 sales since last cash collection
          example: 1.56
        vendTokenSalesAmount:
          type: number
          description: Total token sales since last cash collection
          example: 1.56
        cashless1OverPayAmount:
          type: number
          example: 1.56
        cashless2OverPayAmount:
          type: number
          example: 1.56
        cashless3OverPayAmount:
          type: number
          example: 1.56
        totalAmount:
          type: number
          description: Sum total sales since last cash collection
          example: 1.56
      description: Cashless sales
    Collection:
      required:
        - totalCollectionAmount
        - totalTokensAmount
      type: object
      properties:
        totalCollectionAmount:
          type: number
          description: "[Total Bills]+[Total Coins] Sum value of the money collected from the machine on this cash collection."
          example: 12.56
        totalTokensAmount:
          type: number
          description: "[Total Tokens] Sum value of all tokens collected from the machine on this cash collection."
          example: 13
        totalBills:
          $ref: "#/components/schemas/TotalWithDenomination"
        totalCoins:
          $ref: "#/components/schemas/TotalWithDenomination"
        fromCashbox:
          $ref: "#/components/schemas/TotalWithDenomination"
        manualDispense:
          $ref: "#/components/schemas/TotalWithDenomination"
      description: Collection
    CompanyInfo:
      required:
        - uniqueId
      type: object
      properties:
        uniqueId:
          type: string
          description: Unique identifier in Televend Cloud
          example: 007-1405
        name:
          type: string
          description: The name of the company
          example: INTIS d.o.o
        externalId:
          type: string
          description: Company external ID used for company identification in external partner's ERP system
        address:
          type: string
          description: Company address
          example: Bani 73a, Zagreb
        vatNumber:
          type: string
          description: A Value Added Tax (VAT) number is a unique identification number assigned to a company or a business by the government, which enables them to pay and collect VAT
          example: GB 123 4567 89
      description: Object that contains parameters that identify company this transaction belongs to
    DataStreamingResponseCashCollection:
      type: object
      properties:
        partition:
          type: integer
          format: int32
        offset:
          type: integer
          format: int64
        dataType:
          type: string
        data:
          $ref: "#/components/schemas/CashCollection"
    Denomination:
      required:
        - count
        - denominationValue
      type: object
      properties:
        denominationValue:
          type: number
          description: Denomination value
          example: 0.5
        count:
          type: integer
          description: Count
          format: int64
      description: Count per denomination value
    FillMoney:
      required:
        - filledInMachineAmount
        - leftAfterFillingAmount
        - totalAmount
      type: object
      properties:
        filledInMachineAmount:
          type: number
          description: Money filled in machines
          example: 1.56
        leftAfterFillingAmount:
          type: number
          description: Money left after filling
          example: 0.56
        totalAmount:
          type: number
          description: Total amount
          example: 2.12
      description: Fill money
    Filling:
      type: object
      properties:
        manualFilledCoins:
          $ref: "#/components/schemas/TotalWithDenomination"
      description: Filling
    MachineCashflow:
      required:
        - balanceAmount
        - inputsAmount
        - outputsAmount
      type: object
      properties:
        inputsAmount:
          type: number
          description: Sum of the cash that was inserted into machine since last cash collection
          example: 1.56
        toCoinTubes:
          $ref: "#/components/schemas/TotalWithDenomination"
        toCashbox:
          $ref: "#/components/schemas/TotalWithDenomination"
        toBillStacker:
          $ref: "#/components/schemas/TotalWithDenomination"
        outputsAmount:
          type: number
          description: Total sum of money returned since last cash collection
          example: 0.56
        coinChange:
          $ref: "#/components/schemas/TotalWithDenomination"
        balanceAmount:
          type: number
          description: Total value of money used to purchase or recharge or overpay the machine. Inputs - Output = must be equal to Total Cash income
          example: 1
      description: Machine cash flow
    MachineInfo:
      required:
        - companyUniqueId
        - name
        - uniqueId
      type: object
      properties:
        companyUniqueId:
          type: string
          description: Unique identifier of the company in Televend Cloud that the machine belongs to
          example: 007-1405
        uniqueId:
          type: string
          description: Unique machine ID in Televend Cloud
          example: "4466001"
        externalId:
          maxLength: 32
          minLength: 1
          type: string
          description: Machine external ID used for machine identification in external partner's ERP system
          example: EXT775H46
        pid:
          type: string
          description: Audit device ID, so called PID of the device installed in the machine (typically Televend box, but not limited to)
          example: "12000456"
        deviceType:
          type: string
          description: Type of audit device installed in the machine (typically Televend box, but not limited to)
          example: TE
        locationExternalId:
          type: string
          description: external ID of machine location
          example: 77F443322
        locationName:
          type: string
          description: name of machine location
          example: Intis
        name:
          type: string
          description: Descriptive name of the machine
          example: Coffee machine in shopping mall XYZ
      description: Object that contains parameters that identify machine this transaction belongs to
    RouteInfo:
      required:
        - uniqueId
      type: object
      properties:
        uniqueId:
          type: string
          description: Route ID
          example: "778899"
        name:
          type: string
          description: Route name
          example: My favorite route
      description: Route information
    TotalWithDenomination:
      required:
        - denominations
        - totalAmount
      type: object
      properties:
        totalAmount:
          type: number
          description: Total amount
          example: 12.56
        denominations:
          type: array
          description: Count per denomination value
          items:
            $ref: "#/components/schemas/Denomination"
      description: Total sum of money returned since last cash collection from coin changer
    UserInfo:
      required:
        - uniqueId
      type: object
      properties:
        uniqueId:
          type: string
          description: Unique identifier in Televend Cloud the user belongs to
          example: 007-12345678
        externalId:
          type: string
          description: User external ID used for user identification in external partner's ERP system
        email:
          type: string
          description: User's email address
          example: john.smith@company.com
      description: User information
