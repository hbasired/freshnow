  /importer/common/api/v1/update-external-id:
    post:
      tags:
        - IMPORTER/COMMON
      summary: Update External Id
      description: This API updates the 'external_id' on the sent entity. The entity is identified with the old 'external_id', and if the entity exists, its 'external_id' is set to the new value. The new value must be unique inside company, otherwise an error is returned. If entity doesn't exist for old 'external_id', error is returned.
      operationId: update_external_id_importer_common_api_v1_update_external_id_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEntityExternalIdInput"
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponseModel"
              examples:
                External ID updated successfully:
                  value:
                    meta:
                      code: 200
                      message: External ID updated successfully
                New and old external ID are the same:
                  value:
                    meta:
                      code: 200
                      message: OK
        "400":
          description: Multiple entities for specified 'old_external_id' found
          content:
