openapi: 3.0.2
info:
  title: Importer
  version: 1.11.0
paths:
  /importer/machines/api/v1:
    get:
      tags:
        - IMPORTER/MACHINES
      summary: Get Machines
      description: Get paginated list of Machines
      operationId: get_machines_importer_machines_api_v1_get
      parameters:
        - name: Authorization
          in: header
          description: JWT access token for authentication/authorization. Token type is 'Bearer'
          required: true
          schema: &a1
            type: string
          example: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI.gOiAiSldUIiwia2lkIiA6ICJIZWtNRnBTS05Uak80V3JEcU5qTWZHNU5BMEdkUjR5Ym.FSaXZiMUtWT09RIn0
        - required: false
          schema:
            title: Machineid
            maxLength: 32
            type: array
            items:
              maxLength: 32
              type: string
          name: machineId
          in: query
        - description: If not specified, first page is returned
          required: false
          schema:
            title: Page
            minimum: 1
            type: integer
            description: If not specified, first page is returned
            default: 1
          name: page
          in: query
        - description: If not specified, first 500 entities are returned
          required: false
          schema:
            title: Page Size
            maximum: 2000
            minimum: 1
            type: integer
            description: If not specified, first 500 entities are returned
            default: 500
          name: page_size
          in: query
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CamelCasePaginationResponseModel_ImporterMachineResponse_"
  /importer/machines/api/v1/upsert:
    patch:
      tags:
        - IMPORTER/MACHINES
      summary: Machine Bulk Upsert
      description: Upsert machine by external ID. If machine is found for specified external ID, machine will be updated. Otherwise, new machine will be created.
      operationId: machine_bulk_upsert_importer_machines_api_v1_upsert_patch
