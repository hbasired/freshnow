openapi: 3.0.1
info:
  title: Data-streaming/Vends
  description: API operations related to Vends
  version: 1.9.0-4-SNAPSHOT
servers:
  - url: https://uat-api.televendcloud.com/televend-api
    description: Televend API Gateway
tags:
  - name: Streaming Control
    description: API operations aimed to control data streaming
  - name: Vend
    description: Operations for Vend streaming
paths:
  /data-streaming/{dataType}/api/v1/offsets:
    get:
      tags:
        - Streaming Control
      summary: Get the last committed offsets for all partitions
      operationId: getOffsets
      parameters:
        - name: dataType
          in: path
          description: Type of data for which this streaming control API operation is called
          required: true
          schema:
            type: string
          example: vends
        - name: demoMode
          in: query
          description: If any API operation (where demoMode is supported) is called with demoMode=true, then it refers to operation over example data for demo purposes only. Note that example data contains dummy values, not relevant for business, but technically valid. So it is a good way for a client application to be tested against real data structure as well as demo mode contains exact behaviour like dealing with real data (when demoMode=false)
          required: false
          schema:
            type: boolean
            default: false
          example: true
        - name: Authorization
          in: header
          description: JWT access token for authentication/authorization. Token type is 'Bearer'
          required: true
          schema:
            type: string
          example: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI.gOiAiSldUIiwia2lkIiA6ICJIZWtNRnBTS05Uak80V3JEcU5qTWZHNU5BMEdkUjR5Ym.FSaXZiMUtWT09RIn0
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Offset"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError"
    post:
      tags:
        - Streaming Control
      summary: Commit offsets for all partitions that have been fetched so far (by calling /records API operation) for the selected dataType
      operationId: commitOffsets
      parameters:
        - name: dataType
          in: path
          description: Type of data for which this streaming control API operation is called
          required: true
          schema:
            type: string
          example: vends
        - name: demoMode
          in: query
          description: If any API operation (where demoMode is supported) is called with demoMode=true, then it refers to operation over example data for demo purposes only. Note that example data contains dummy values, not relevant for business, but technically valid. So it is a good way for a client application to be tested against real data structure as well as demo mode contains exact behaviour like dealing with real data (when demoMode=false)
          required: false
          schema:
            type: boolean
            default: false
          example: true
        - name: Authorization
          in: header
          description: JWT access token for authentication/authorization. Token type is 'Bearer'
          required: true
          schema:
            type: string
          example: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI.gOiAiSldUIiwia2lkIiA6ICJIZWtNRnBTS05Uak80V3JEcU5qTWZHNU5BMEdkUjR5Ym.FSaXZiMUtWT09RIn0
      responses:
        "204":
          description: No content
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError"
  /data-streaming/{dataType}/api/v1/offsets/reset:
    post:
      tags:
        - Streaming Control
      summary: Reset offsets for selected dataType. Reset means moving offsets back or forth
      description: Be aware this API operation has impact what will return subsequent calls to /records API operation!!! For example if your application already fetched 100000 messages and currently has zero messages behind. Then this operation is called with resetType=EARLIEST, that means your application will be 100000 messages behind. And subsequent calls to /records API operation will return 100000 messages in overall in order to catch up again to the latest offsets (of course several subsequent calls to /records API operation will be required, not just one)
      operationId: resetOffsets
      parameters:
        - name: dataType
          in: path
          description: Type of data for which this streaming control API operation is called
          required: true
          schema:
            type: string
          example: vends
        - name: resetType
          in: query
          description: "Specify which type of reset is requested.\r

            \ EARLIEST: positions data consuming to the earliest message available (body is ignored, if provided). LATEST: positions data consuming to the latest new message that will arrive right after execution of this API operation (body is ignored, if provided).\ 

            \ OFFSET: positions data consuming to the specific offset somewhere in the middle as requested by the values in the body of the request (this type requires body to be provided that contains exactly specified offset values per partitions)"
          required: true
          schema:
            type: string
            enum:
              - EARLIEST
              - LATEST
              - OFFSET
          example: EARLIEST
        - name: demoMode
          in: query
          description: If any API operation (where demoMode is supported) is called with demoMode=true, then it refers to operation over example data for demo purposes only. Note that example data contains dummy values, not relevant for business, but technically valid. So it is a good way for a client application to be tested against real data structure as well as demo mode contains exact behaviour like dealing with real data (when demoMode=false)
          required: false
          schema:
            type: boolean
            default: false
          example: true
        - name: Authorization
          in: header
          description: JWT access token for authentication/authorization. Token type is 'Bearer'
          required: true
          schema:
            type: string
          example: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI.gOiAiSldUIiwia2lkIiA6ICJIZWtNRnBTS05Uak80V3JEcU5qTWZHNU5BMEdkUjR5Ym.FSaXZiMUtWT09RIn0
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/OffsetReset"
      responses:
        "204":
          description: No content
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError"
  /data-streaming/vends/api/v1/records:
    get:
      tags:
        - Vend
      summary: Fetch collection of new vend records that have come up meanwhile after a previous call of this API operation
      operationId: fetchVendRecords
      parameters:
        - name: maxBytes
          in: query
          description: This parameter is ignored and will be removed in one of next major or minor releases. It will be ignored even if present after the removal, so no action in client software is required.
          required: false
          deprecated: true
          schema:
            type: integer
            format: int64
            default: 10485760
          example: 10485760
        - name: demoMode
          in: query
          description: If any API operation (where demoMode is supported) is called with demoMode=true, then it refers to operation over example data for demo purposes only. Note that example data contains dummy values, not relevant for business, but technically valid. So it is a good way for a client application to be tested against real data structure as well as demo mode contains exact behaviour like dealing with real data (when demoMode=false)
          required: false
          schema:
            type: boolean
            default: false
          example: true
        - name: Authorization
          in: header
          description: JWT access token for authentication/authorization. Token type is 'Bearer'
          required: true
          schema:
            type: string
          example: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI.gOiAiSldUIiwia2lkIiA6ICJIZWtNRnBTS05Uak80V3JEcU5qTWZHNU5BMEdkUjR5Ym.FSaXZiMUtWT09RIn0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataStreamingResponseTelevendVend"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError"
        "406":
          description: Not Acceptable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError"
components:
  schemas:
    ApplicationError:
      type: object
      properties:
        code:
          type: integer
          format: int32
        codeType:
          type: string
        error:
          type: string
        cause:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        tracingId:
          type: string
        errorType:
          type: string
          enum:
            - CLIENT_ERROR
            - CLIENT_ERROR_UNRESOLVABLE
            - CLIENT_ERROR_EXPIRED
            - CLIENT_ERROR_BUG
            - CLIENT_ERROR_BUG_EXPIRED
            - CLIENT_ERROR_BUG_UNRESOLVABLE
            - SERVER_ERROR_EXT
            - SERVER_ERROR_INT
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      properties:
        fieldName:
          type: string
        rejectedValue:
          type: string
        message:
          type: string
    OffsetReset:
      type: object
      properties:
        partition:
          type: integer
          format: int32
        offset:
          type: integer
          format: int64
    Offset:
      type: object
      properties:
        dataType:
          type: string
        partition:
          type: integer
          format: int32
        offset:
          type: integer
          format: int64
        earliestOffset:
          type: integer
          format: int64
        latestOffset:
          type: integer
          format: int64
        messagesBehind:
          type: integer
          format: int64
        messagesCount:
          type: integer
          format: int64
    Barcode:
      type: object
      properties:
        barcode:
          type: string
        barcode1:
          type: string
        barcode2:
          type: string
        barcode3:
          type: string
        barcode4:
          type: string
    CompanyInfoExtended:
      required:
        - uniqueId
      type: object
      properties:
        uniqueId:
          type: string
          description: Unique identifier in Televend Cloud
          example: 007-1405
        name:
          type: string
          description: The name of the company
          example: INTIS d.o.o
        externalId:
          type: string
          description: Company external ID used for company identification in external partner's ERP system
        address:
          type: string
          description: Company address
          example: Bani 73a, Zagreb
        vatNumber:
          type: string
          description: A Value Added Tax (VAT) number is a unique identification number assigned to a company or a business by the government, which enables them to pay and collect VAT
          example: GB 123 4567 89
        vatPayer:
          type: boolean
          example: false
      description: Object that contains parameters that identify company this transaction belongs to
    DataStreamingResponseTelevendVend:
      type: object
      properties:
        partition:
          type: integer
          format: int32
        offset:
          type: integer
          format: int64
        dataType:
          type: string
        data:
          $ref: "#/components/schemas/TelevendVend"
    MachineInfo:
      required:
        - companyUniqueId
        - name
        - uniqueId
      type: object
      properties:
        companyUniqueId:
          type: string
          description: Unique identifier of the company in Televend Cloud that the machine belongs to
          example: 007-1405
        uniqueId:
          type: string
          description: Unique machine ID in Televend Cloud
          example: "4466001"
        externalId:
          maxLength: 32
          minLength: 1
          type: string
          description: Machine external ID used for machine identification in external partner's ERP system
          example: EXT775H46
        pid:
          type: string
          description: Audit device ID, so called PID of the device installed in the machine (typically Televend box, but not limited to)
          example: "12000456"
        deviceType:
          type: string
          description: Type of audit device installed in the machine (typically Televend box, but not limited to)
          example: TE
        locationExternalId:
          type: string
          description: external ID of machine location
          example: 77F443322
        locationName:
          type: string
          description: name of machine location
          example: Intis
        name:
          type: string
          description: Descriptive name of the machine
          example: Coffee machine in shopping mall XYZ
      description: Object that contains parameters that identify machine this transaction belongs to
    TelevendProduct:
      type: object
      properties:
        uniqueId:
          type: string
          description: Unique product identifier in Televend Cloud
          example: "778899"
        externalId:
          type: string
          description: Product external ID used for product identification in external partner's ERP system
          example: EXT174H
        name:
          type: string
          description: Descriptive name of the sold product
          example: Coffee with milk, mid size
        depositRefundAmount:
          type: number
          description: Deposit refund amount. The currency of this amount is indicated by vend.currency field (the same currency as for this vend
          example: 0.5
        barcode:
          $ref: "#/components/schemas/Barcode"
      description: Product that this vend refers to
    TelevendRecipe:
      type: object
      properties:
        externalId:
          type: string
          description: External ID of the recipe in Televend Cloud used for this product
          example: "14"
        name:
          type: string
          description: Name of the recipe in Televend Cloud used for this product
          example: Coffee/milk classic
      description: Recipe of the composite product
    TelevendVend:
      required:
        - amount
        - company
        - correlationId
        - currency
        - failedVend
        - inTestMode
        - originId
        - paymentType
        - quantity
        - receivingTime
        - timestamp
        - transactionId
        - uniqueId
        - version
      type: object
      properties:
        correlationId:
          maxLength: 40
          minLength: 12
          type: string
          description: Unique correlation ID of this message in the TelevendCloud
          example: 23QPV2V5THQ87W
        version:
          minimum: 1
          type: integer
          description: Every very first original message has version 1. If the same message needs to be updated due to any reason every subsequent update of it will have version 2, 3, 4 and so on. In case updated versions are not desired, then a client application  may use this parameter to process only messages with version=1. Any subsequent vesions may be discarded in such case.
          format: int64
          example: 4
          default: 1
        timestamp:
          type: string
          description: |-
            ISO date and time when the transaction or event occurred in the machine or device or in the system 
            NOTE1: this is NOT time of sending the request, but the very first time of occurence
          format: date-time
          example: 2023-06-17T17:33:27.902+02:00
        receivingTime:
          type: string
          description: Date and time when a message has been received by Televend Cloud if applicable. Otherwise it matches the same time as 'timestamp' field
          format: date-time
          example: 2023-06-17T17:33:28.406+02:00
        machine:
          $ref: "#/components/schemas/MachineInfo"
        company:
          $ref: "#/components/schemas/CompanyInfoExtended"
        uniqueId:
          type: string
          description: Unique vend ID in Televend Cloud system
          example: "1234"
        transactionId:
          type: string
          description: Globally unique ID of this vend
          example: 12000456-12345678
        column:
          maximum: 65535
          minimum: 0
          type: integer
          description: Identifier of a machine column where sales occurred. This is the technical machine column what the machine reported. It may or may not be equal to viewColumn. It depends on a certain machine. When no product is associated with the column, it is considered as a „ghost vend“. Must be a integer in range [0, 65535] or null.
          format: int32
          example: 48
        viewColumn:
          maximum: 65535
          minimum: 0
          type: integer
          description: Identifier of a machine column where sales occurred. This is the machine column what actually a user can view in the machine and select it. When no product is associated with the column, it is considered as a „ghost vend“. Must be a integer in range [0, 65535] or null.
          format: int32
          example: 53
        quantity:
          minimum: 1
          type: integer
          description: Number of vends (sales) of this column
          format: int32
          example: 1
        amount:
          maximum: 100000
          exclusiveMaximum: false
          minimum: 0
          exclusiveMinimum: false
          type: number
          description: "Amount of vend(s) in currency. The value must be decimal number. Acceptable range min: 0, max: 100000"
          example: 2.45
        currency:
          pattern: ^[A-Z]{3}$
          type: string
          description: Currency of the amount
          example: EUR
        taxRate:
          minimum: 0
          exclusiveMinimum: false
          type: number
          description: Product tax rate of the sold product in percentage
          example: 12
        originId:
          type: string
          description: Used mainly for correlation of an origin asynchronous call towards T-Box and data messages from T-Box as a result of the origin call
          example: A384P5YDU6B
        paymentType:
          type: string
          description: "Payment type which can be one of following: CASH, CASHLESS_1, CASHLESS_2, CASHLESS_3, TOKEN, FREE, TEST, CREDIT_CARD, TELEVEND_WALLET"
          example: CASH
          enum:
            - CASH
            - CASHLESS_TELEVEND_WALLET
            - CASHLESS_1
            - CASHLESS_2
            - CASHLESS_3
            - TEST
            - FREE
            - TOKEN
            - CREDIT_CARD
            - TELEVEND_WALLET
            - MONEY_RETURN
        paymentCashlessLoopType:
          type: string
          description: Object referent to CASHLESS payment type. Required only if payment type is CASHLESS
          example: OPEN
          enum:
            - OPEN
            - CLOSED
        inTestMode:
          type: boolean
          description: Indicates machine was in test mode when this vend happened
          example: false
        failedVend:
          type: boolean
          description: True in case vend has been failed, otherwise false
          example: false
        product:
          $ref: "#/components/schemas/TelevendProduct"
        recipe:
          $ref: "#/components/schemas/TelevendRecipe"
        voucher:
          $ref: "#/components/schemas/TelevendVoucher"
        attributes:
          type: object
          additionalProperties:
            type: object
            description: A map of additional attributes used for specific business requirements. All attributes from the map will be propagated through the whole processing chain just like other fields of this object
            example:
              paramInteger: 12
              paramString: some text
              paramBoolean: true
              paramNull: null
              paramComplex:
                name: John Smith
                color: blue
          description: A map of additional attributes used for specific business requirements. All attributes from the map will be propagated through the whole processing chain just like other fields of this object
          example:
            paramInteger: 12
            paramString: some text
            paramBoolean: true
            paramNull: null
            paramComplex:
              name: John Smith
              color: blue
    TelevendVoucher:
      required:
        - currency
        - name
        - value
      type: object
      properties:
        externalId:
          type: string
          description: Voucher external ID in the voucher system
          example: EPFX5514
        name:
          type: string
          description: Voucher name from the voucher system
          example: "48"
        description:
          type: string
          description: Voucher descriptive details, if any
        value:
          type: number
          description: Voucher Discount on the product
          example: 2.45
        currency:
          type: string
          description: Currency of value field
          example: EUR
