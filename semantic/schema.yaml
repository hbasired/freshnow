# semantic/schema.yaml — hand-maintained meaning layer for the FreshNow schema.
# Reflection gives you types; only a human gives you meaning. Every column carries a
# plain-business-language `notes`. Every foreign key carries a `purpose` naming the
# business question its join answers — INCLUDING self-referential keys, because nothing
# in the column types tells a model that a self-join is required.
#
# A migration that changes a table MUST update this file in the same task. The
# `semantic layer stays in sync` test fails if a base table is missing here.

version: 1

tables:
  employee:
    notes: One row per worker (warehouse, production, drivers, retail) and the CEO. Identity is linked to a Telegram account only after an invite code is redeemed.
    columns:
      id: Primary key (uuid).
      display_name: The person's name as shown to the CEO. Demo rows are prefixed "DEMO".
      telegram_user_id: The permanent numeric Telegram id (bigint — exceeds int32). NULL until the account is linked.
      manager_employee_id: Who this person reports to. Since migration 0009 this decides visibility — a manager or lead sees their direct reports. A trigger refuses a reporting line that loops.
      access_role: >
        What the person may DO — ceo | admin | ops_head | supervisor | manager | lead | cash_auditor |
        warehouse_keeper | technician | vmo | employee (TASK-057). Distinct from role_title (the job
        title they typed). What each role allows is the role_capability table: admin sees everything;
        ops_head, supervisor and manager see and assign to their direct reports; lead also sees everyone
        in their department (compared case-insensitively); the others see only themselves. Read
        policies go through app_can_view_employee(target) and app_has_capability(), where it is enforced.
      role_title: >
        Their JOB TITLE, in free text ("Production Supervisor"). NOT a permission. `access_role`
        beside it is what decides what a person may see and do — these two are the pair most
        easily confused, and filtering on role_title to find managers returns whatever somebody
        happened to type.
      department: Function, e.g. production, warehouse, delivery, retail.
      site: Physical location the person works at.
      shift: Working pattern; drives daily-prompt timing.
      language: Preferred language (English or Hindi in the demo).
      status: pending | active | disabled. Active only after onboarding completes.
      is_synthetic: TRUE for demo/seed rows. Never present a synthetic row as a real fact.
      email: Work address for the email channel. NULL means no email. Added 2026-09-19; the consent notice must name email before an address is stored (docs/EMAIL-SETUP-GUIDE.md section 4).
      auth_user_id: The Supabase Auth account this person signs in to the dashboard with (uuid). NULL means no dashboard login. The API maps a verified sign-in token to an employee through this column only. It is not a Telegram identity and says nothing about work done.
      created_at: When this employee RECORD was created — not when the person joined the company.
    foreign_keys:
      manager_employee_id:
        references: employee.id
        purpose: >
          SELF-REFERENTIAL. "Who does X report to / who is on Y's team" requires a self-join:
          FROM employee e JOIN employee m ON e.manager_employee_id = m.id. Seeded staff report
          to the CEO; the CEO changes reporting lines on the People tab (audited as
          employee.org_updated with before/after).

  task:
    notes: >
      A unit of work owned by one employee. Daily status is reported against tasks. Since
      migration 0010 a task also carries how far along it is and on what EVIDENCE — a
      percentage here is always one of three things, named in progress_source, and never a
      number a model produced.
    columns:
      task_number: The task's short public number (migration 0021). Shown and typed as "FN-<number>" — e.g. FN-42 — in emails, the dashboard and chat. Unique, never reused. Use it to answer "what is FN-42?" (WHERE task_number = 42).
      id: Primary key.
      employee_id: The employee responsible for the task.
      title: Short description of the work.
      details: Longer description, optional.
      status: open | pending | in_progress | done | cancelled — a key into task_status, whose category (todo / in_progress / done) is what reports should group by.
      resolution: WHY the task stopped, set together with a closing status — done | wont_do | duplicate | cancelled. NULL while open. Status says where it is; resolution says why it ended.
      resolved_at: When it stopped.
      progress_pct: 0–100. Meaningless without progress_source.
      progress_source: >
        counted (done steps / total steps — the strongest evidence), status (the percentage the
        status implies, task_status.pct_when_here, used when there are no steps), or
        self_reported (a person typed it, with a mandatory note in progress_note; shown
        labelled, replaced by the next counted change or by finishing — a status tap such as
        "still pending" does not replace it, since TASK-054). "Is this task really 90% done" is
        answered by this column, not by the number.
      progress_note: The reason a person gave for a self-reported figure.
      progress_band_low: >
        Lower end of the range a person PICKED (e.g. 10 for "10–20%"); NULL when they typed an
        exact figure or the percentage is counted/status-derived. When set, progress_pct is the
        band's midpoint — an estimate for arithmetic, never a measurement. Report the band, not
        the midpoint, when describing one task.
      progress_band_high: Upper end of that range (e.g. 20 for "10–20%"). Set together with progress_band_low.
      progress_updated_at: When the percentage last changed.
      started_at: First time work was reported on it. With due_at, gives the elapsed fraction that the "behind" warning compares against progress.
      priority: low | normal | high | urgent.
      parent_task_id: The task this is a step of, when task_type is subtask. One recursive table, not a table per level.
      task_type: task | subtask.
      estimate_minutes: Optional size, for weighted rollups later.
      due_at: Optional deadline (timestamptz, stored UTC).
      created_at: >
        When the task was created. With resolved_at this is the cycle time `flow_metrics`
        measures; against now() it is how long an open task has been waiting.
      project_id: >
        The project this work belongs to, or NULL for ordinary operational work. The task table
        is the unit of work for projects TOO — there is no parallel project-task system — so a
        person's list is one list whichever it came from.
      milestone_id: The milestone within that project, when it is filed under one.
      source_email_id: The inbound email this task was created from (migration 0022), when the CEO or a manager emailed the work in; NULL for work given any other way. Answers "which email did FN-57 come from?".
      is_synthetic: TRUE for demo/seed rows.
    foreign_keys:
      employee_id:
        references: employee.id
        purpose: "Whose task is this / list a person's tasks."
      project_id:
        references: project.id
        purpose: "The work under project X — and, aggregated, its computed progress. NULL means ordinary operational work, which is how flow_metrics separates the two."
      milestone_id:
        references: milestone.id
        purpose: "Is milestone X's work actually finished: count tasks under it whose status category is not 'done'."
      status:
        references: task_status.key
        purpose: "Group or count by CATEGORY (todo / in_progress / done): JOIN task_status s ON s.key = task.status and use s.category, never the raw status name."
      parent_task_id:
        references: task.id
        purpose: "SELF-REFERENTIAL. Subtasks of a task: FROM task child JOIN task parent ON child.parent_task_id = parent.id."
      source_email_id:
        references: email_message.id
        purpose: "Where a task came from when it was emailed in: the sender, subject and when (JOIN email_message e ON e.id = task.source_email_id)."

  task_status:
    notes: Lookup of the five task statuses, each mapped to a reporting category and to the percentage a task is considered to be at merely by being in that status (status-based progress, used when a task has no steps). The percentages are assumed placeholders until the company sets its own.
    columns:
      key: The status value stored on task.status.
      label: How it is shown.
      category: todo | in_progress | done — what reports and boards run on.
      pct_when_here: Percentage implied by this status when a task has no steps to count.
      position: Display order.

  project:
    notes: >
      Work that has a plan, a shape and an end — as opposed to a task, which is a thing
      somebody does today. Progress is NEVER stored here: query the `project_progress` view,
      which computes it from milestone weights or the tasks' own percentages. `health` is the
      one judgement on the row (whether a slip is worrying is a human call, not arithmetic),
      and it always carries a note saying why.
    columns:
      id: Primary key.
      name: What the project is called.
      code: Short human handle used in conversation ("NB-01"). Unique when present.
      purpose: WHY it exists, in the business's own words.
      status: draft | active | on_hold | done | cancelled. Only 'active' projects are swept.
      start_date: Planned start — with target_date, what schedule_elapsed_pct is computed from.
      target_date: Planned finish.
      sponsor_employee_id: Who wants it delivered.
      lead_employee_id: Who is running it.
      health: green | amber | red. Set by a person, never computed.
      health_note: Why the health is what it is. Required when setting it.
      health_updated_at: When the judgement was last made — an old green is worth less than a new one.
      created_by: Who started it.
      created_at: When.
      is_synthetic: TRUE for demo/seed rows.
    foreign_keys:
      lead_employee_id:
        references: employee.id
        purpose: "What is person X running; and, with app_can_view_employee, who may see the project."
      sponsor_employee_id:
        references: employee.id
        purpose: "What has person X sponsored."

  project_requirement:
    notes: >
      What the project must deliver, prioritised MoSCoW. 'wont' is the half people forget:
      recording what is explicitly OUT of scope is what stops it being argued back in later.
      `acceptance` is how we will know it is met — a requirement nobody can test is not one.
    columns:
      id: Primary key.
      project_id: The project.
      kind: need | requirement | constraint | assumption.
      text: The requirement in plain words.
      priority: must | should | could | wont (MoSCoW).
      acceptance: How we will know it is met.
      status: open | met | dropped.
      raised_by: Who asked for it.
      position: Order within the project.
      created_at: When.
      is_synthetic: TRUE for demo/seed rows.
    foreign_keys:
      project_id:
        references: project.id
        purpose: "What must project X deliver: group by priority to see the musts first."

  milestone:
    notes: >
      When. `weight` is its share of the project's progress, so a two-month milestone need not
      count the same as a two-day one — this is what makes the rollup weighted rather than a
      count. A milestone cannot be marked done while tasks under it are open unless the person
      doing it explicitly forces it, and the audit records that they did.
    columns:
      id: Primary key.
      project_id: The project.
      name: What is being reached.
      due_date: When it is due.
      weight: Share of the rollup, 1-100. Equal unless somebody says otherwise.
      status: open | done | cancelled.
      done_at: When it was reached.
      position: Order within the project.
      created_at: When.
      is_synthetic: TRUE for demo/seed rows.
    foreign_keys:
      project_id:
        references: project.id
        purpose: "The milestones of project X, and the weighted rollup that is its progress."

  project_member:
    notes: Who is on a project. Drives both visibility (a member may see it) and who is told when it turns red or hits a serious issue.
    columns:
      id: Primary key.
      project_id: The project.
      employee_id: The person.
      role: sponsor | lead | member | watcher.
      created_at: When they joined.
    foreign_keys:
      project_id:
        references: project.id
        purpose: "Who is on project X — and therefore who is told about it."
      employee_id:
        references: employee.id
        purpose: "What projects is person X on."

  project_update:
    notes: >
      The status log, append-only — a status history that can be edited is not a history.
      `pct_reported` is what a person SAYS; `project_progress.progress_pct` is what the tasks
      actually show. Both are kept deliberately: the GAP between them is the most useful number
      on the page, and the audit row for each update records the computed figure at that moment.
    columns:
      id: Primary key.
      project_id: The project.
      author_id: Who wrote it.
      narrative: What happened, in their words.
      pct_reported: Where they say they are. NOT the project's progress.
      health: The health they are claiming, if they set one.
      period_start: Optional period the update covers.
      period_end: Optional period end.
      created_at: When.
      correlation_id: The run that wrote it.
      is_synthetic: TRUE for demo/seed rows.
    foreign_keys:
      project_id:
        references: project.id
        purpose: "The story of project X over time; and, with project_progress, claimed against measured."
      author_id:
        references: employee.id
        purpose: "Who reports on projects."

  project_issue:
    notes: >
      Risks and obstacles to the PLAN — deliberately NOT the `blocker` table. A broken chiller
      is an operational blocker with a response window measured in minutes and an escalation
      ladder; "the supplier may not deliver in time" is a project risk reviewed weekly. One
      table for both would give one of them the wrong urgency and would corrupt the blocker
      SLA statistics. A high or critical issue tells everyone on the project.
    columns:
      id: Primary key.
      project_id: The project.
      milestone_id: The milestone it threatens, when it threatens one.
      kind: issue | risk | dependency | decision.
      title: What the problem is.
      description: The detail.
      severity: low | medium | high | critical. high/critical tell the project's members.
      status: open | mitigating | resolved | accepted. 'accepted' means we decided to live with it.
      owner_id: Who is handling it.
      raised_by: Who spotted it.
      mitigation: What is being done about it (set while mitigating).
      due_date: When it must be settled by; the sweep flags it once past.
      resolved_at: When it was settled.
      resolution_note: How it was settled.
      created_at: When.
      correlation_id: The run that raised it.
      is_synthetic: TRUE for demo/seed rows.
    foreign_keys:
      project_id:
        references: project.id
        purpose: "What is threatening project X, worst first."
      owner_id:
        references: employee.id
        purpose: "What risks is person X carrying."

  project_progress:
    notes: >
      A VIEW, one row per project — the only correct source for "how far along is project X".
      Every number is SQL over every row. `progress_pct` is the weighted milestone rollup when
      the project has milestones and the average of its tasks' own evidence-based percentages
      otherwise; `progress_source` says WHICH, so the number is never read without its basis.
      A task in the 'done' category counts as 100 whatever its stored percentage says.
      `schedule_elapsed_pct` is NULL when the dates are not set — an unknown is not zero.
      Compare it against progress_pct for "behind"; never turn that into a prediction.
    columns:
      project_id: The project.
      name: Its name.
      status: The project's status.
      health: The human judgement.
      start_date: Planned start.
      target_date: Planned finish.
      tasks_total: Tasks under it.
      tasks_done: Tasks whose status category is 'done'.
      tasks_in_progress: Tasks whose status category is 'in_progress'.
      milestones_total: Milestones.
      milestones_done: Milestones reached.
      milestones_overdue: Open milestones whose due_date has passed.
      issues_open: Issues open or being mitigated.
      issues_serious: Of those, the high and critical ones.
      progress_pct: The computed percentage. Read `progress_source` with it, always.
      progress_source: milestones (weighted rollup) | tasks (average of task percentages).
      schedule_elapsed_pct: How much of the planned time has been used, or NULL without dates.
      last_update_at: When somebody last wrote a status update. NULL means never.
      updates_total: How many status updates exist.

  flow_metrics:
    notes: >
      A VIEW of the Kanban Guide's four flow metrics, per project (project_id NULL = ordinary
      operational work). Cycle time is given as PERCENTILES, never a mean: the distribution is
      skewed and the mean of a skewed distribution describes nobody's experience. Work Item Age
      (oldest_open_days) is the only LEADING indicator here — it is about work still open,
      while throughput and cycle time describe work already finished.
      Deliberately absent: SPI, CPI, earned value, velocity, burndown. They need a time-phased
      cost baseline FreshNow does not have, and inventing one would be a fabricated number.
    columns:
      project_id: The project, or NULL for ordinary operational work.
      wip: Work started and not finished — the number the Kanban Guide says to limit.
      open_total: All unfinished work, started or not.
      oldest_open_days: Work Item Age of the oldest unfinished item.
      avg_open_days: Mean age of unfinished work.
      throughput_7d: Items finished in the last 7 days.
      throughput_28d: Items finished in the last 28 days.
      cycle_p50_days: Median time from start to finish.
      cycle_p85_days: 85th percentile — the number to quote when forecasting a single item.
      cycle_p95_days: 95th percentile.
      finished_total: Items finished, all time.

  task_step:
    notes: A checklist item under a task. Counting done steps against all steps is what makes a task's percentage evidence rather than opinion. Deleted with its task.
    columns:
      id: Primary key.
      task_id: The task it belongs to.
      title: The step, in plain words.
      position: Order within the task.
      done: Whether it is ticked.
      done_at: When it was ticked.
      done_by: Who ticked it (kept NULL if that person is later removed).
      created_by: Who added the step.
      created_at: When.
      is_synthetic: TRUE for demo/seed rows.
    foreign_keys:
      task_id:
        references: task.id
        purpose: "How far along is task X: count(*) filter (where done) / count(*) over its steps."
      done_by:
        references: employee.id
        purpose: "Who ticked this step off."

  task_relation:
    notes: >
      A directional or symmetric link between two tasks — blocks / blocked_by, precedes /
      follows, relates, duplicates. Every directional link is stored TWICE, once in each
      direction with the inverse kind, written together, so either task answers "what am I
      waiting on" alone. Ordering links cannot form a loop; a task has at most 30 relations.
    columns:
      id: Primary key.
      from_task_id: The task the sentence starts from.
      to_task_id: The other task.
      kind: blocks | blocked_by | precedes | follows | relates | duplicates.
      created_by: Who linked them.
      created_at: When.
      is_synthetic: TRUE for demo/seed rows.
    foreign_keys:
      from_task_id:
        references: task.id
        purpose: "What is task X waiting on: WHERE from_task_id = X AND kind = 'blocked_by' — the inverse row is always present, so no need to search both columns."
      to_task_id:
        references: task.id
        purpose: "The other end of the link; join to task for its title and status."

  progress_event:
    notes: Append-only history of every change to a task's percentage, with its source and, for a self-reported figure, the person's note. "It sat at 90% for three weeks" is a query over this table. Deleted with its task.
    columns:
      id: Primary key.
      task_id: The task.
      employee_id: Who caused the change (NULL for a purely derived recompute, or if that person was later removed).
      pct: The new percentage. For a picked range, the range's midpoint.
      band_low: Lower end of the range the person picked, when they picked one (NULL otherwise).
      band_high: Upper end of that range.
      source: counted | status | self_reported.
      note: The reason, for a self-reported figure.
      correlation_id: Ties the change to the request or message that caused it.
      created_at: When.
      is_synthetic: TRUE for demo/seed rows.
    foreign_keys:
      task_id:
        references: task.id
        purpose: "Progress over time for task X, ordered by created_at."

  task_update:
    notes: A single status report against a task. The raw employee text is stored before any LLM parse, so an update is never lost to an API timeout.
    columns:
      id: Primary key.
      task_id: The task being reported on (nullable for a general update).
      employee_id: Who submitted the update.
      status: done | pending | blocker | in_progress — the deterministic button tap.
      note_raw: Exactly what the employee typed/said, kept forever.
      note_parsed: LLM-extracted structure (jsonb); replaceable by re-running the parser.
      channel: Where the report came from — telegram (the bot) or web (the dashboard). The end-of-day counts do not distinguish; the record does.
      telegram_message_id: Reference to the source message (bigint).
      correlation_id: Ties every step of this run together in audit_log / run_trace.
      submitted_at: When it arrived (timestamptz, UTC).
      is_synthetic: TRUE for demo/seed rows.
    foreign_keys:
      employee_id:
        references: employee.id
        purpose: "Whose update is this — the basis for RLS employee isolation."
      task_id:
        references: task.id
        purpose: "Which task this update reports on."

  blocker:
    notes: An obstacle stopping a task. Extracted from a task_update. Routed by a deterministic lookup and escalated on SLA. In the demo everything routes to the CEO.
    columns:
      id: Primary key.
      task_update_id: The update the blocker was extracted from.
      raised_by: The employee who reported the blocker.
      assigned_resolver: The employee who must fix it (the CEO in the demo).
      category: Kind of problem, e.g. equipment, supply, staffing, quality.
      severity: low | medium | high | critical.
      status: open | acknowledged | resolved | cancelled.
      risk: Free-text consequence, e.g. "cold chain / spoilage".
      affected_asset: What is affected, e.g. "van 2 chiller".
      correlation_id: Run correlation id.
      sla_due_at: When escalation fires if unacknowledged.
      resolved_at: When the problem was closed (status resolved).
      resolved_by: Who closed it.
      resolution_note: How it was resolved — required when closing, because the next person to hit the same problem will ask.
      alert_id: >
        The alert this report was folded into. Several reports of the same problem share one
        alert: acknowledging it acknowledges all of them, and only the first climbs the
        escalation ladder. Count blockers for "how often was this reported", count alerts for
        "how many problems were there" — they are different questions.
      raised_at: When the blocker was created.
      is_synthetic: TRUE for demo/seed rows.
    foreign_keys:
      alert_id:
        references: alert.id
        purpose: "Every report folded into one problem: FROM blocker b JOIN alert a ON b.alert_id = a.id."
      raised_by:
        references: employee.id
        purpose: >
          TWO joins to employee are needed. raised_by answers "who reported it":
          FROM blocker b JOIN employee reporter ON b.raised_by = reporter.id.
      assigned_resolver:
        references: employee.id
        purpose: >
          The SECOND join to employee, aliased separately, answers "who must fix it":
          JOIN employee resolver ON b.assigned_resolver = resolver.id.

  escalation:
    notes: >
      History of escalation steps for a blocker (level, who it went to, why). One row per
      person told at that level, so a level with two targets writes two rows. A row with
      escalated_to NULL records a rung that had nobody available and was skipped — kept
      deliberately, so the ladder is not retried forever and the gap is visible.
    columns:
      id: Primary key.
      blocker_id: The blocker being escalated.
      level: Escalation level (1, 2, ...). Bounded by the ladder; never loops.
      escalated_to: Who it was escalated to. NULL means the rung was skipped for want of a target.
      reason: Why it escalated (e.g. SLA breach).
      created_at: When. The clock the next rung's timeout is measured from.
      correlation_id: The run that caused this escalation, so it joins to audit_log, run_trace and the outbox row the person actually received. NULL on rows written before migration 0015.
      is_synthetic: TRUE for demo/seed rows.
    foreign_keys:
      blocker_id:
        references: blocker.id
        purpose: "Which blocker this escalation belongs to."
      escalated_to:
        references: employee.id
        purpose: "How often did work escalate to person X, and at which level."

  alert:
    notes: >
      One row per PROBLEM, not per report. A second report of the same problem while the
      first is still open increments count instead of paging anyone again (alias-based
      de-duplication, as Opsgenie does it) — this is why two identical escalation messages
      no longer appear. Three states: triggered -> acknowledged -> resolved. Acknowledged
      means somebody said they are on it; resolved means it is fixed. They are different
      questions and different columns.
    columns:
      id: Primary key.
      alias: >
        What counts as "the same problem": the person, the category and the named asset,
        lowercased. Without a named asset there is no safe way to call two reports the same,
        so the alias falls back to the blocker's own id — the failure mode is one message
        too many, never one too few.
      kind: What sort of thing it is about (blocker).
      entity: The table the alert is about.
      entity_id: The id of the FIRST occurrence; later ones are folded in and counted.
      employee_id: Who the alert is about (the raiser). Drives who may see the row.
      state: triggered | acknowledged | resolved.
      count: How many times this problem was reported while the alert was open.
      first_seen: The first report.
      last_seen: The most recent report.
      acked_by: Who said they were on it.
      acked_at: When.
      resolved_at: When the last live report of it was resolved.
      correlation_id: The run that opened it.
      is_synthetic: TRUE for demo/seed rows.
    foreign_keys:
      employee_id:
        references: employee.id
        purpose: "Whose problems are these — and, with count, which problems keep coming back."
      acked_by:
        references: employee.id
        purpose: "Who responds to problems, and how quickly (acked_at - first_seen)."

  sla_policy:
    notes: >
      How long a problem of each severity may wait for an acknowledgement before it
      escalates. Was a constant in TypeScript; now a table, so the window changes without a
      deploy. Seeded with the old constants, which are [assumed] until FreshNow supplies real
      service levels.
    columns:
      severity: low | medium | high | critical (primary key).
      minutes: The response window in minutes.
      updated_at: When it was last changed.
      is_synthetic: TRUE for the seeded placeholder values.

  escalation_policy:
    notes: A named ladder of escalation levels. Exactly one row may be the default (a partial unique index enforces it).
    columns:
      id: Primary key.
      name: What the ladder is called.
      is_default: The ladder unacknowledged problems climb.
      is_synthetic: TRUE for demo/seed rows.
      created_at: When.

  escalation_level:
    notes: One rung of a ladder. Level 1 fires timeout_minutes after the response window runs out; each later rung that long after the previous one fired.
    columns:
      id: Primary key.
      policy_id: The ladder this rung belongs to.
      level_no: Position on the ladder, 1-10 (the CHECK is what bounds escalation).
      timeout_minutes: How long to wait before this rung fires.
    foreign_keys:
      policy_id:
        references: escalation_policy.id
        purpose: "The rungs of ladder X, in order."

  escalation_target:
    notes: >
      Who a rung tells, named symbolically — the resolver, the manager of whoever raised it,
      the department lead, the CEO, or one named person. Symbolic so the ladder survives
      staff changes: it is resolved to actual people at the moment it fires.
    columns:
      id: Primary key.
      level_id: The rung.
      target_type: resolver | manager_of_raiser | department_lead | ceo | employee.
      target_employee_id: The named person, and only when target_type is 'employee' (a CHECK ties the two together).
      position: Order within the rung; the first rule that names a person is the reason recorded.
    foreign_keys:
      level_id:
        references: escalation_level.id
        purpose: "Who is told at rung X."
      target_employee_id:
        references: employee.id
        purpose: "Which ladders name person X directly (as opposed to by role)."

  task_watcher:
    notes: >
      Who else is told about a task besides its owner. reason records why they are on the
      list, so an assignee or a manager added automatically reads differently from somebody
      who chose to follow it.
    columns:
      id: Primary key.
      task_id: The task.
      employee_id: The person following it.
      reason: assignee | manager | raised_by | watcher.
      created_at: When.
    foreign_keys:
      task_id:
        references: task.id
        purpose: "Who is told when task X changes."
      employee_id:
        references: employee.id
        purpose: "What is person X following."

  notification_pref:
    notes: >
      One person's rule for one event on one channel. No row means the default: Telegram
      immediately if they are linked, and the in-app inbox always. 'digest' is honoured as
      "not now" — digests are not built yet, and sending immediately anyway would make the
      preference a lie.
    columns:
      id: Primary key.
      employee_id: Whose rule it is.
      event_type: Which event (blocker.raised, blocker.escalated, blocker.resolved, task.assigned, task.done).
      channel: telegram | email | webpush. The in-app inbox is not optional and has no rule.
      mode: immediate | digest | off.
      delay_minutes: Hold the message this long (0-1440) — the message waits, it is not dropped.
      updated_at: When it was last changed.
    foreign_keys:
      employee_id:
        references: employee.id
        purpose: "How does person X want to be told — and who has turned a channel off."

  channel_setting:
    notes: >
      The company's switch for each delivery channel, flipped by the CEO in the dashboard.
      A channel needs THREE things to carry a message: keys on the server (environment),
      this row set true, and — for everything except the in-app inbox — the person's own
      notification_pref. Ships with telegram and inapp on and email, webpush and chat off,
      so turning one on is a deliberate act by a named person, recorded as channel.toggled
      in audit_log.
    columns:
      channel: telegram | inapp | email | webpush | chat. The primary key.
      enabled: Whether the company is using it. Not whether it is configured.
      updated_by: Who flipped it. Null for the seeded defaults, which nobody chose.
      updated_at: When it was last flipped.
    foreign_keys:
      updated_by:
        references: employee.id
        purpose: "Who switched a channel on or off, and when — asked after the first unexpected message."

  push_subscription:
    notes: >
      One browser's web-push endpoint. One row per DEVICE, not per person: somebody with a
      phone and a desktop has two. The payload is encrypted to p256dh/auth (RFC 8291), so
      the push relay in the middle — Google, Apple or Mozilla — carries ciphertext it cannot
      read. A device that answers 404 or 410 is deleted rather than retried forever.
      Visible only to its owner: which devices a person carries is not an operational fact,
      and the platform does not collect it for anyone else to see.
    columns:
      id: Primary key.
      employee_id: Whose device it is.
      endpoint: The push service's URL for this device. Unique — re-subscribing returns the same one.
      p256dh: The device's public key. Used to encrypt the payload, never read by us.
      auth: The device's auth secret, same purpose.
      user_agent: For the person's own list of their devices. Never parsed or analysed.
      created_at: When the device subscribed.
      last_seen_at: The last time a push to it succeeded.
      is_synthetic: True for demo rows.
    foreign_keys:
      employee_id:
        references: employee.id
        purpose: "Which devices should a web-push notification for this person go to."

  routing_rule:
    notes: The single source of truth for routing. Deterministic lookup (category, site, shift) -> resolver. Seeded degenerate in the demo — every rule resolves to the CEO.
    columns:
      id: Primary key.
      category: Blocker category the rule matches (NULL = catch-all).
      site: Site the rule matches (NULL = any).
      shift: Shift the rule matches (NULL = any).
      resolver_employee_id: Who resolves a matching blocker (the CEO in the demo).
      is_synthetic: TRUE for demo/seed rows.
    foreign_keys:
      resolver_employee_id:
        references: employee.id
        purpose: '"Why did this blocker go to X?" — answered by a row here, never by a model.'

  assignment:
    notes: A task the CEO (or a manager) assigned to an employee, delivered on the channels chosen for it or the assignee's own rules (Telegram, the app, email). The employee reports status back, closing the loop.
    columns:
      id: Primary key.
      task_id: The task created for the assignment.
      assigned_by: Who assigned it (the CEO).
      assigned_to: Who received it.
      note: What the CEO asked for.
      status: assigned | accepted | done | cancelled.
      notify_channels: The channels the person giving the work CHOSE to tell the assignee on — any of telegram, app, email (migration 0022). NULL means nobody chose and the assignee's own notification rules applied. What was actually sent is in notification_outbox; this is the intent.
      origin: Where the assignment was made — dashboard, telegram, document or email. NULL on assignments made before migration 0022 (unknown, not guessed).
      created_at: When.
      is_synthetic: TRUE for demo/seed rows.
    foreign_keys:
      assigned_by:
        references: employee.id
        purpose: "Who assigned the task (first join to employee)."
      assigned_to:
        references: employee.id
        purpose: "Who received it (second, separately-aliased join to employee)."

  consent_record:
    notes: PDPL consent captured at onboarding — the policy version and a hash of the exact notice text the employee saw.
    columns:
      id: Primary key.
      employee_id: Who consented.
      policy_version: Version of the privacy notice.
      notice_hash: Hash of the notice text actually displayed.
      consented_at: When.
      is_synthetic: TRUE for demo/seed rows.
    foreign_keys:
      employee_id:
        references: employee.id
        purpose: "Whose consent this records."

  invite_code:
    notes: A single-use code the CEO issues so a real person can link their Telegram account. Preserves the "identity is never self-declared" rule while letting the employee self-fill their profile.
    columns:
      id: Primary key.
      code: The unambiguous single-use code.
      display_name: The name the CEO entered when issuing it.
      employee_id: The employee row created/linked on redemption.
      issued_by: Who issued the code (the CEO).
      expires_at: Expiry (single-use, time-limited).
      redeemed_at: When redeemed (NULL until used).
      created_at: When issued.
      is_synthetic: TRUE for demo/seed rows.
    foreign_keys:
      employee_id:
        references: employee.id
        purpose: "Which employee this code onboards."
      issued_by:
        references: employee.id
        purpose: "Who issued the code (the CEO)."

  voice_asset:
    notes: A Telegram voice message. The row is written BEFORE transcription so audio is never lost. Feeds the same parse pipeline as typed text.
    columns:
      id: Primary key.
      employee_id: Who sent the voice message.
      file_id: Telegram file id for the audio.
      local_path: Where the downloaded audio was stored.
      transcript_raw: Whisper transcript (kept verbatim).
      status: pending | transcribed | failed.
      created_at: When.
      is_synthetic: TRUE for demo/seed rows.
    foreign_keys:
      employee_id:
        references: employee.id
        purpose: "Whose voice message this is."

  notification_outbox:
    notes: Every outbound message is written here first and delivered by the worker — exactly-once via idempotency_key. Business logic never calls Telegram directly.
    columns:
      id: Primary key.
      idempotency_key: UNIQUE — makes delivery exactly-once from the employee's view.
      chat_id: Telegram chat to deliver to (bigint). NULL on every channel but telegram.
      payload: The message content (jsonb).
      status: pending | sent | failed | abandoned.
      human_approved: TRUE only when the CEO explicitly tapped to send on their behalf.
      attempts: Delivery attempts (bounded).
      created_at: When queued.
      sent_at: When delivered.
      channel: >
        Which sender delivers it: telegram | inapp | email | webpush. The worker claims only
        channels it has a sender for, so a row for a channel that is not switched on waits
        rather than failing. 'inapp' IS the notification — the row itself is what the person
        reads in the dashboard, and it needs no external service at all.
      recipient_employee_id: >
        Who this message is for. Set on everything written since the alert rules landed; NULL
        on older rows and on anything addressed only by chat_id.
      reason: >
        The rule that chose this recipient, in plain words ("assignee", "resolver",
        "escalation level 2 -> ceo"). This is what makes "who was told, and why" a query.
      read_at: When the recipient read it (the inapp channel only).
      next_attempt_at: >
        The relay may not claim this row again before this time. Carries both the delivery
        backoff and a person's own "hold it for N minutes" rule — so a pending row that is not
        being sent is usually waiting, not stuck.
      correlation_id: >
        The run that produced this message. This is what answers "the CEO received this
        alert — what caused it?", by joining to audit_log and run_trace. NULL on rows written
        before migration 0015.
      is_synthetic: TRUE for demo/seed rows.
    foreign_keys:
      recipient_employee_id:
        references: employee.id
        purpose: "What was person X told, and why: their inbox, and every channel they were reached on."

  audit_log:
    notes: Append-only record of every state change. No UPDATE/DELETE for the app role. Any number shown to the CEO traces back here via correlation_id.
    columns:
      id: Primary key.
      correlation_id: Ties all steps of one run together.
      actor: Who/what performed the action (e.g. "employee:<uuid>", "system").
      action: >
        What happened (e.g. blocker.routed). Security-relevant actions worth querying on
        their own: security.injection_detected (a document contained text aimed at the
        model rather than at a person), security.rate_limited (someone hit a per-person
        cap), document.blocked (a file was refused outright — wrong type, executable,
        oversize), document.flagged (a file carries active content so it may be read but
        never forwarded), attachment.stored, eod.generated, invite.cancelled. Work actions:
        task.created (who put a task on whose list — actor is the creator, detail names
        the owner), task.assigned, task_update.recorded (detail.channel says which
        channel), blocker.acknowledged (actor is the person who tapped, "system" only for
        the sweep), employee.org_updated (a role or reporting-line change, with before and
        after in detail). Alerting: alert.enqueued (detail.recipients lists every person,
        channel and matched rule — the answer to "who was told what and why"),
        alert.deduplicated (a repeat of a problem already open was counted, not sent again),
        alert.acknowledged, alert.resolved, alert.no_recipient (a rule matched nobody — worth
        querying, it means somebody should have been told and was not),
        blocker.escalation_skipped (a ladder rung had nobody available and was passed over),
        notification_pref.set (someone changed how they are told). Failure and reconciliation
        (added 2026-09-18): blocker.routing_failed (a problem was recorded but no rule could place
        it — a human was alerted instead), blocker.rerouted (the reconciliation sweep placed a
        previously unrouted blocker), blocker.still_unroutable (it tried and could not),
        notification.abandoned (delivery gave up after the attempt limit — THIS MESSAGE WAS NEVER
        RECEIVED; detail names the recipient and the last error), consent.missing (an update was
        captured for a person with no consent record — at most once per person per day),
        eod.gate_failed (the model's end-of-day narrative stated a number that appeared in no
        computed count, so the prose was withheld and only the counts were shown — detail lists
        the unsourced numbers), webhook.rejected (a request reached the Telegram webhook path
        without the right secret token; the token itself is never recorded). Data protection
        (PDPL): retention.notes_aged (the free text of updates older than RETENTION_DAYS was
        redacted — detail carries the window and a count, never the words),
        employee.erased (a person was anonymised — name, Telegram, login and every note replaced,
        every row kept; detail carries the reason and counts, never content).
      entity: The kind of thing acted on.
      entity_id: Its id.
      detail: Extra structured context (jsonb).
      created_at: When.

  run_trace:
    notes: >
      Step-by-step record of a run — the INPUTS each step consumed and the output it produced,
      which is what makes a run replayable rather than merely logged. Written by the real code
      paths since 2026-09-18 (parse_update, route_blocker); before that only the seeder wrote it
      and the table held two rows. Append-only: one run may perform the same step for several
      entities, and a retry appears twice because it happened twice.
    columns:
      id: Primary key.
      correlation_id: The run this step belongs to.
      step: Name of the step.
      input: Step input (jsonb).
      output: Step output (jsonb).
      created_at: When.

  llm_call:
    notes: One row per LLM invocation — model, tokens, cost, latency, success. Backs the daily budget cap and cost observability.
    columns:
      id: Primary key.
      correlation_id: The run this call belongs to.
      provider: groq | openrouter | nvidia — the provider that answered (voice transcription is logged as groq).
      model: Model id used.
      prompt_tokens: Input tokens.
      completion_tokens: Output tokens.
      cost_usd: Estimated cost.
      latency_ms: Round-trip latency.
      success: Whether the call succeeded.
      redacted: How many identifiers (phone numbers, emails, Emirates IDs, IBANs, card numbers) were removed from the prompt before it was sent — rule R7. A count only; what was removed is never stored.
      created_at: When.

  job_run:
    notes: One row per scheduled/background job execution — outcome and duration. Makes a stuck or looping job visible in stored state.
    columns:
      id: Primary key.
      job_name: Which job ran.
      status: Outcome.
      detail: Structured context (jsonb).
      started_at: Start time.
      finished_at: End time.
      created_at: When the row was written.

  daily_report:
    notes: One end-of-day report per employee per day. The counts are computed in SQL over every row; the summary is written by the model from those already-final numbers, so a report can never contain an invented total. Regenerating a day replaces it (unique on employee_id + report_date).
    columns:
      id: Primary key.
      employee_id: Whose day this describes.
      report_date: The day being reported (date, not timestamp).
      completed: How many updates that day reported 'done'. Computed in SQL.
      pending: How many reported 'pending' or 'in_progress'. Computed in SQL.
      blockers: How many reported 'blocker'. Computed in SQL.
      reports_made: Total updates submitted that day. Computed in SQL.
      summary: Model-written narrative, grounded in the counts above. Never a source of numbers.
      detail: jsonb breakdown — every update with the person's own words, blockers raised, and tasks still open.
      generated_at: When the report was last (re)generated.
      is_synthetic: TRUE for demo/seed rows.
    foreign_keys:
      employee_id:
        references: employee.id
        purpose: "Whose end-of-day report this is. Join to employee for their name/department."

  attachment:
    notes: Files sent with an assignment or a status report — a spec sheet with an instruction, a photo of a fault with a breakdown report. Only Telegram's file_id and the metadata are stored, never the bytes, so no employee document sits on this machine. A file_id is re-sendable by the same bot, which is how an attachment reaches the assignee without being downloaded.
    columns:
      id: Primary key.
      assignment_id: The assignment this file came with, when it was sent with an instruction.
      task_id: The task this file belongs to.
      task_update_id: The status report this file was filed against.
      uploaded_by: Who sent the file.
      file_id: Telegram's handle for the file. Re-sendable by this bot; not a durable archive.
      file_unique_id: Stable identifier across bots — used to notice the same file arriving twice.
      file_name: Original filename, when Telegram supplied one (documents only).
      mime_type: Content type as Telegram reported it.
      file_size: Size in bytes as Telegram reported it.
      kind: document | photo | voice | video | audio — decides which Bot API method re-sends it.
      caption: What the sender wrote on the file itself, if anything.
      created_at: When it arrived.
      is_synthetic: TRUE for demo/seed rows.
    foreign_keys:
      assignment_id:
        references: assignment.id
        purpose: "Which instruction this file was sent with. Join to assignment to answer 'what was Rashid actually given?'"
      task_id:
        references: task.id
        purpose: "Which job this file relates to. Join to task for the title."
      task_update_id:
        references: task_update.id
        purpose: "Which status report this file was evidence for. Join to task_update to show the photo beside the words."
      uploaded_by:
        references: employee.id
        purpose: "Who sent the file. Join to employee for their name."

  email_message:
    notes: >
      Every email the system sent or received, one row each (migration 0020). Outbound rows are
      the notifications the worker delivered by email; inbound rows are what arrived in the
      system's mailbox — a reply to a task email, or the CEO sending work. Unique on
      (direction, message_id), so the same email can never be processed twice. Only two kinds of
      inbound row do anything: a reply from an employee becomes a task_update; an email from
      someone who may give work becomes an email_proposal. Everything else is refused or ignored
      with the reason recorded.
    columns:
      id: Primary key.
      direction: in | out.
      message_id: The email's Message-ID header (without angle brackets) — the email's own identity.
      in_reply_to: The Message-ID this email answered, when it was a reply. Matching it to an outbound row is how a reply finds its task.
      thread_refs: The References header — earlier Message-IDs in the conversation.
      from_address: Sender address, lower-cased.
      to_address: Recipient address, lower-cased.
      subject: Subject line. Our outbound subjects carry a task token like [FN-1a2b3c4d].
      body_text: INBOUND ONLY — what the person wrote, quoted history removed. Free text written by a person; aged by the retention sweep, cleared by erasure. Outbound bodies live in notification_outbox.payload.
      employee_id: The person on our side — the sender of an inbound email, the recipient of an outbound one. NULL for a refused stranger.
      task_id: The task the email was about, when known.
      assignment_id: The assignment an outbound email delivered, when it did.
      task_update_id: The status report an inbound reply became.
      outbox_id: The notification_outbox row an outbound email delivered. Join to notification_outbox.id for its attempts and status. Deliberately NOT a foreign key (the outbox relay locks that row while sending; an FK check would wait on it).
      status: sent | failed (outbound); received | processed | refused | ignored (inbound).
      reason: Why it was refused or ignored, or what it became — plain words for the audit.
      attempts: Inbound only — how many times reading it was tried. An email left 'received' by a model outage is retried a bounded number of times.
      auth: The receiving server's verdicts as read — spf, dkim, dmarc, and how the sender was proven.
      correlation_id: Ties the email to the run it started (audit_log, run_trace).
      sent_at: The email's own Date header.
      created_at: When the system recorded it.
      is_synthetic: TRUE for demo/test rows.
    foreign_keys:
      employee_id:
        references: employee.id
        purpose: "Whose email this was. Join to employee for the name — 'which emails did Hemanth send this week?'"
      task_id:
        references: task.id
        purpose: "Which job an email was about. Join to task for the title."
      assignment_id:
        references: assignment.id
        purpose: "Which instruction an outbound email carried — 'was Rashid emailed about this assignment?'"
      task_update_id:
        references: task_update.id
        purpose: "The status report an emailed reply became. Join to task_update for the parsed result."

  email_proposal:
    notes: >
      Tasks read out of an email sent by someone who may give work (the CEO, a manager or lead),
      waiting for a person to apply or dismiss them in the dashboard. A proposal never assigns
      anything by itself. Owners are already checked against the directory by name.
    columns:
      id: Primary key.
      email_message_id: The inbound email the proposal was read from.
      proposed_by: Who sent the email.
      summary: One clause on what the email was.
      tasks: The proposed tasks as JSON — title, detail, owner (when the written name fits exactly one person), the name as written, how the owner was found, and the candidates when a name fits several people.
      status: pending | applied | dismissed.
      decided_by: Who applied or dismissed it.
      decided_at: When it was decided. NULL while pending.
      created_at: When it was proposed.
      is_synthetic: TRUE for demo/test rows.
    foreign_keys:
      email_message_id:
        references: email_message.id
        purpose: "The email behind a proposal — its sender, subject and words."
      proposed_by:
        references: employee.id
        purpose: "Who sent the work by email."
      decided_by:
        references: employee.id
        purpose: "Who applied or dismissed the proposal."

  tv_machine:
    notes: >
      Televend's vending machines as last read from Televend (migration 0023, refreshed by every sync). A read-only copy —
      nothing here is written back to Televend. Names change over time (see tv_machine_caption); the physical machine,
      with the asset number staff use, is in `machine`. Visible to the CEO only until the operations roles exist.
    columns:
      televend_id: Televend's own id for the machine record. Primary key.
      caption: The machine's current name in Televend, e.g. "Metro …-791-DXB". Not an identity — names change.
      asset_no: The 3–4 digit number inside the name that staff write ("Mina 793"); survives renames. NULL when the name has none.
      enabled: Whether the machine is enabled in Televend (the live fleet).
      pid: The telemetry box's id as Televend shows it.
      external_id: The machine's external id in Televend, when one is set.
      location_id: Televend's location record id.
      location_caption: Televend's location group, e.g. "Metro", "Hospital / Clinics" — a grouping, not an address.
      city: City of the location as Televend has it.
      region_caption: Televend region.
      machine_type_caption: Televend machine type, e.g. "RTA Metro Stations", "Hospitals".
      stock_tracking: Whether Televend tracks this machine's stock.
      last_vend_at: When the machine last sold, per Televend.
      last_refill_at: When the machine was last refilled, per Televend. A change is how the sync knows which refill logs to read.
      stock_percent: Televend's stock level, percent of the machine's capacity in cups.
      last_status: Televend's last status code for the machine (code meanings not yet mapped).
      connection_status: Televend's connection status code.
      signal_strength: Mobile signal strength the telemetry box reported.
      raw: Televend's own JSON for the machine as last read — for replaying the normalisation.
      first_seen_at: When the sync first saw this machine.
      last_seen_at: When the sync last saw it.
      is_synthetic: TRUE for demo/test rows.

  tv_machine_caption:
    notes: Every name a Televend machine has had, with when the sync first and last saw it. Answers "what was this machine called on 12 Oct?" — exports and WhatsApp posts use old names.
    columns:
      televend_id: The Televend machine. Part of the primary key.
      caption: One of its names. Part of the primary key.
      first_seen_at: When the sync first saw this name.
      last_seen_at: When the sync last saw this name.
    foreign_keys:
      televend_id:
        references: tv_machine.televend_id
        purpose: "Which machine had this name. Join to tv_machine for its current name and details."

  machine:
    notes: >
      FreshNow's own record of a physical vending machine — one per asset number. Created by the Televend sync on first
      sight of an enabled machine; later carries the QR sticker token a visit starts with. Televend's records of the same
      machine (it can move or be re-registered) are linked through machine_placement.
    columns:
      id: Primary key.
      asset_no: The machine's asset number, as staff write it. Unique.
      label: What people call it today — follows the Televend name unless set by hand.
      label_manual: TRUE when the label was set by hand and the sync must not change it.
      model: Machine model, when known (e.g. an Oranfresh model).
      serial_no: Manufacturer serial number, when known.
      qr_token: Random token printed as the machine's QR sticker; scanning it proves presence at the machine.
      status: active | inactive | retired.
      notes: Free notes about the machine.
      cash_price_fils: What one cash vend brings in, in fils (1/100 AED); NULL = the configured default (AED 10, assumed A-T62.1). Used to work out the cash a collection should have found.
      service_shift: The only shift the machine may be serviced on (day | night), set by a planner — e.g. "Schedule rashid always Night"; NULL = any. A plan of the other shift is warned about.
      service_note: Why, in the planner's words (the hospital allows the trolley at night only).
      category_override: FreshNow's correction of the machine's category for the analytics (TASK-070) — NULL = Televend's region (tv_machine.region_caption). "Not counted" keeps a machine out of the figures (a test machine). Televend itself is never changed.
      category_note: Why the category was corrected, in the words of the person who did it.
      category_set_by: Who last corrected the category (machines.manage — Ops Head, CEO, Admin).
      category_set_at: When the category was last corrected.
      created_at: When the record was created.
      updated_at: When it last changed.
      is_synthetic: TRUE for demo/test rows.

  alarm_rule:
    notes: >
      What FreshNow does with each kind of Televend alarm (migration 0031, TASK-059) — hand-maintained, like routing_rule.
      Whether it needs someone, how long it must stay open first (so blips that clear themselves are never a problem),
      which category routes it to a resolver, how severe it is, and what to do. An alarm name with no row is treated as
      needing someone after 30 minutes. Read by the people who run the machines.
    columns:
      name: Televend's alarm name, exactly as tv_event.name carries it. Primary key.
      class: actionable (needs someone after its on-delay) | noise (a blip unless it outlasts its on-delay) | info (never a problem).
      on_delay_minutes: How long the alarm must stay open before it needs someone.
      category: The problem category it becomes — the key routing_rule uses to pick who resolves it (equipment, stock, cash).
      severity: low | medium | high | critical — sets the SLA.
      advice: What to do, in words a supervisor reads.
      updated_at: When the rule last changed.

  machine_alarm:
    notes: >
      Each Televend alarm that became — or joined — a problem (migration 0031). One problem stays open per machine and
      alarm name however often Televend repeats the alarm; it closes itself when Televend clears every alarm behind it.
      Written by the worker only when OPS_ALARM_PROBLEMS is on. Read by the people who run the machines.
    columns:
      id: Primary key.
      event_source: The Televend event's source (tv_event.source).
      event_id: The Televend event's id (tv_event.external_id). Unique with event_source.
      machine_tv_id: Televend's machine record (tv_machine.televend_id).
      machine_id: FreshNow's machine, when the registry knows it.
      alarm_name: The alarm's name, as in alarm_rule.name.
      started_at: When Televend raised the alarm.
      blocker_id: The problem it raised or joined.
      linked_at: When the worker linked it.
      cleared_at: When Televend resolved it; NULL while it is open.
      released_at: Set when its problem was closed because its Televend record was switched off while it was still open (migration 0041) — the link is let go, so the record switched back on raises it again.
      is_synthetic: TRUE for demo/test rows.
      correlation_id: Joins the sync run to its audit rows.
    foreign_keys:
      blocker_id:
        references: blocker.id
        purpose: '"Which problem does this alarm belong to?" and "which alarms are behind this problem?"'
      machine_id:
        references: machine.id
        purpose: '"Which machine raised it?" — the asset number and label.'

  machine_placement:
    notes: Which Televend machine record a physical machine is, over time. One open placement (valid_to NULL) per Televend record; a disabled Televend machine has none.
    columns:
      id: Primary key.
      machine_id: The physical machine.
      tv_machine_id: The Televend machine record it is (or was).
      valid_from: Since when.
      valid_to: Until when; NULL = now.
      source: televend_sync (made by the sync) | manual.
      created_at: When the row was written.
      is_synthetic: TRUE for demo/test rows.
    foreign_keys:
      machine_id:
        references: machine.id
        purpose: "The physical machine — join to machine for its asset number and label."
      tv_machine_id:
        references: tv_machine.televend_id
        purpose: "The Televend record — join to tv_machine to reach its vends, events and refills (by machine_tv_id)."

  tv_vend:
    notes: >
      Every sale (vend) Televend recorded, one row each, copied by the sync (migration 0023). One cup per row in practice
      (quantity). Payment types as Televend names them (Cash, Cashless, Cashless 3, Token, Wallet). `value` is NULL while
      the Televend account may not see revenue. Counts per day are only complete for days whose tv_sync_run says complete.
    columns:
      source: Which Televend transport read it — bridge (web endpoints) or official (Data-Streaming API). Part of the primary key.
      external_id: Televend's id for the vend in that transport. Part of the primary key.
      machine_tv_id: The Televend machine (tv_machine.televend_id); not a foreign key so a vend from a machine not yet synced is kept.
      at: When the vend happened.
      product: Product name, e.g. "Orange Juice New".
      payment_type: Televend's payment type code.
      payment_caption: Payment type as Televend names it.
      value: Price paid in AED; NULL when hidden from the Televend account.
      column_no: Machine column (32767 = Televend's default single column).
      quantity: Units sold in this vend.
      price_list: Televend price list number.
      device_vend_id: The telemetry box's own vend number — recognises one vend across transports.
      raw: Televend's own JSON for the vend.
      synced_at: When the sync stored it.
      is_synthetic: TRUE for demo/test rows.

  tv_event:
    notes: >
      Every machine event Televend recorded — alarms (kind alarm), warnings, and info events such as "Cash has been
      collected from the machine." (migration 0023). Updated when Televend resolves an alarm. Over half of alarms are
      short blips that clear within minutes; actionable ones stay open for hours (TASK-055 findings).
    columns:
      source: bridge | official. Part of the primary key.
      external_id: Televend's id for the event. Part of the primary key.
      machine_tv_id: The Televend machine (tv_machine.televend_id).
      level: Televend's level — 3 alarm, 2 warning, 1 info.
      kind: alarm | warning | info | unknown — the level in words.
      type_code: Televend's event type code.
      source_code: Televend's code for where the event came from (machine, server…).
      name: Event name as Televend's exports show it, when given.
      description: What happened, in Televend's words, e.g. "Bill / Cash Box Full", "ORF_RST".
      started_at: When it started (for a repeating alarm, its latest start).
      resolved_at: When Televend marked it resolved; NULL while open. Can be earlier than started_at for repeating alarms.
      counter: How many times it repeated.
      raw: Televend's own JSON for the event (it can include who resolved it — personal data).
      first_seen_at: When the sync first stored it.
      last_seen_at: When the sync last changed it.
      checked_at: When the sync last re-read this open alarm's window to see whether Televend has cleared it (migration 0033; the oldest checked go first).
      is_synthetic: TRUE for demo/test rows.

  tv_refill:
    notes: >
      Every refill log row Televend recorded: who filled which machine, when, by how many cups (migration 0023).
      Corrections typed later through Televend's web app are rows with action 'corrected' — they are not new fills.
      filled_by is personal data (a person's name).
    columns:
      id: Primary key.
      source: bridge | official | file (a portal export).
      natural_key: Machine asset number + time to the second + machine column + action + quantity — the refill's identity across sources. Unique.
      machine_tv_id: The Televend machine (tv_machine.televend_id); NULL for rows imported from an export.
      machine_caption: The machine's name when the row was read.
      at: When the refill was logged.
      filled_by: Who filled, as Televend shows the name. Personal data.
      role: Their Televend role, e.g. Filler.
      column_no: Machine column.
      product: Product filled.
      action: filled | corrected | removed | unknown.
      quantity_change: Televend's quantity as given. For action filled or corrected it is the cups added (negative for a downward correction); for action removed it is the number of cups TAKEN OUT, as a positive number. Never sum it across actions — the change to a machine is minus quantity_change for removed rows, and unknown rows have no known direction.
      quantity_after: Cups in the machine after the change.
      capacity: Machine capacity in cups.
      origin: mobile_app (Staff App at the machine) | web_app | televend | unknown.
      raw: Televend's own JSON for the row (includes the name).
      synced_at: When the sync stored it.
      is_synthetic: TRUE for demo/test rows.

  tv_sync_run:
    notes: One row per Televend sync or backfill run per stream — window, requests sent, rows read, new and changed, and whether the read was complete (for a whole day of vends, complete also means it equalled Televend's own count). The record that says which days can be trusted as complete.
    columns:
      id: Primary key.
      stream: machines | vends | events | refills.
      mode: incremental (every ~10 min) | daily_check (yesterday, whole day) | backfill.
      transport: bridge | official | files.
      window_from: Start of the time window read.
      window_to: End of the window read.
      requests: Requests sent to Televend by this run.
      rows_read: Rows Televend returned.
      rows_new: Rows that were new to the mirror.
      rows_changed: Rows that changed (e.g. an alarm resolved).
      complete: TRUE only for a complete read (and, for whole-day vends, a count that matched Televend's).
      televend_count: Televend's own vend count for the window, when it was checked.
      status: ok | partial | error.
      error: What went wrong, when it did.
      correlation_id: Ties the run to audit and job records.
      started_at: When the run started.
      finished_at: When it finished.

  tv_sync_cursor:
    notes: How far each Televend stream has been read completely by the incremental sync. Moves only after a complete read.
    columns:
      stream: vends | events | refills. Primary key.
      read_until: Everything before this instant has been read completely at least once.
      updated_at: When it last moved.

  media_object:
    notes: One photo or short video as one person sent it, stored cleaned (no location or device metadata) in Supabase Storage. The bytes are named by the sha256 of their cleaned content and stored once even when several people send the same picture; each sender has their own row (migration 0030, D212), and the bytes are deleted only when no row needs them. The bytes are never in the database; this is the record of them. Seen by whoever may see the person who sent it.
    columns:
      id: Primary key.
      sha256: The fingerprint of the cleaned bytes (64 hex characters). Unique per sender — the same person sending the same picture again gets their row back (its retention extended if they asked for longer).
      kind: photo | video.
      mime: image/jpeg (every photo is re-encoded as JPEG) | video/mp4.
      bytes: Size of the cleaned file.
      width: Pixels across, for a photo (after shrinking to at most 2048 on the long edge). NULL for a video.
      height: Pixels down, for a photo. NULL for a video.
      duration_ms: Length of a video in milliseconds (15 000 at most). NULL for a photo.
      storage_path: Where the file is in the private "media" bucket (year/month/sha256.ext). Shared by every row with the same sha256.
      thumb_path: Where its small preview is (thumbs/sha256.jpg); NULL for a video.
      uploaded_by: Who sent it (employee.id). Personal data; on erasure it points at the anonymised row.
      captured_at: When the phone says it was taken — sent by the app, never read from the file. NULL when not sent.
      uploaded_at: When it was received.
      retention_class: evidence | video | receipt | chat — decided by the server from what the file is (a video is always video; a photo is evidence unless sent as a receipt; chat from the chat module).
      retention_until: When it is due to be deleted (bytes first, then this row).
      scan_status: clean (a virus scanner checked it) | not_scanned (no scanner configured).
      stripped: 'What was removed before storing — {"metadata": "all (re-encoded)"} for a photo, {"mp4_boxes": [...]} for a video.'
      is_synthetic: TRUE for demo/test rows.
      correlation_id: Joins the upload to its audit rows.
    foreign_keys:
      uploaded_by:
        references: employee.id
        purpose: '"Who sent this picture?" and "what has this person sent?" (their data export).'

  media_link:
    notes: What a photo or video belongs to — a task today; visits, cash collections and chat messages later. Seen when its file is.
    columns:
      id: Primary key.
      media_id: The file (media_object.id).
      entity_type: What it is attached to — task, or stock_doc (a delivery, a damage, a handover; migration 0032).
      entity_id: The id of that thing (task.id for a task, stock_doc.id for a stock document).
      role: evidence | receipt | other — why it is attached.
      linked_by: Who attached it.
      linked_at: When.
      is_synthetic: TRUE for demo/test rows.
      correlation_id: Joins the link to its audit rows.
    foreign_keys:
      media_id:
        references: media_object.id
        purpose: '"Which photos show the work on this task?"'
      linked_by:
        references: employee.id
        purpose: '"Who attached this photo?"'

  inv_item:
    notes: >
      What the warehouse keeps (migration 0032): oranges, cups and packaging, consumables, cleaning
      supplies, vehicle and spare parts, company phones. Seeded from the warehouse's WhatsApp list of 15–16 Oct;
      units it did not state are assumed (A-T60.2). Each item is counted in ONE unit. Stock is never stored
      here — see stock_balance.
    columns:
      id: Primary key.
      name: What people call it, e.g. Oranges, Straws, Trolley belt. Unique ignoring case.
      category: oranges | cups_packaging | consumable | cleaning | spare_part | vehicle | device | other.
      unit: The unit every amount of it is in — carton, box, piece, roll, can, gallon, bottle, pack.
      step: The smallest amount anyone enters — 1 carton, 0.5 box of straws.
      min_level: Below this the warehouse is low (🚨 and a notice once a day). NULL = no minimum set.
      count_tolerance: A count this close to the record skips the second person's recount (it is still approved).
      icon: An emoji shown on the screens.
      sort_order: Order on the screens and in the stock list.
      active: FALSE = no longer used; kept for its history.
      device_id: When the item is a company phone, which one.
      created_by: Who added it.
      created_at: When it was added.
      updated_at: When it last changed.
      is_synthetic: TRUE for demo/test rows.
    foreign_keys:
      device_id:
        references: device.id
        purpose: '"Who holds the company phone?" — the phone as an item of stock.'
      created_by:
        references: employee.id
        purpose: '"Who added this item to the list?"'

  inv_location:
    notes: >
      The places stock can be (migration 0032): the warehouse, each person who holds stock, in transit (a
      handover the other side has not confirmed), and four bookkeeping places that are not shelves — suppliers
      (deliveries come from there), used, damaged, count adjustments. The fixed places have fixed ids ending
      b001–b006. A person's place has no name of its own: use the employee's name.
    columns:
      id: Primary key.
      kind: warehouse | person | in_transit | supplier | used | damaged | adjustment.
      name: The place's name; NULL for a person's place (their name is employee.display_name).
      employee_id: Whose stock this is, for a person's place.
      is_virtual: TRUE for the bookkeeping places (supplier, used, damaged, adjustment) — they may go below zero.
      active: FALSE = no longer used.
      created_at: When it was made (a person's place — the first time they held anything).
      is_synthetic: TRUE for demo/test rows.
    foreign_keys:
      employee_id:
        references: employee.id
        purpose: '"What does this person hold?" — join stock_balance on location_id.'

  stock_doc:
    notes: >
      One stock document (migration 0032): a delivery (receipt), a handover between the warehouse and a person
      or between two people, stock used or damaged, a count adjustment, or a reversal of a mistake. Its content
      never changes; only its state moves forward. The amounts that actually moved are in stock_move.
    columns:
      id: Primary key — made by the phone or browser, so the same request sent twice posts once.
      kind: receipt | handover | use | damage | count_adjustment | reversal | supplier_return (stock sent back to a supplier, migration 0042).
      from_location_id: Where the stock comes from (the giver for a handover).
      to_location_id: Where it goes (the receiver for a handover).
      state: posted | reversed (most kinds); waiting | accepted | part_accepted | settled | refused | cancelled (a handover).
      created_by: Who made it.
      confirm_side: A handover — who confirms it, person or warehouse.
      confirm_by: A handover confirmed by one person — who.
      answered_by: Who confirmed or refused the handover.
      answered_at: When.
      answer_reason: Why less arrived or it was refused — not_received | wrong_items | wrong_count | damaged | other.
      answer_note: The receiver's words.
      settled_by: The approver who settled what was still in transit.
      settled_at: When.
      settle_note: The approver's words.
      reason: Why — used (machine_refill, cleaning, shift_use, repair, other), damaged (spoiled, broken, expired, sorting_waste, other), reversed (entered_by_mistake, wrong_quantity, wrong_item, duplicate, other), returned to a supplier (quality, wrong_item, excess, damaged_on_arrival, expired, other).
      note: Free words from the person who made it.
      supplier: A delivery or a return to a supplier — the supplier, as on its paper (a planned one copies supplier.name).
      invoice_no: A delivery — the invoice or delivery-note number (a planned one copies wh_order.source_ref).
      machine_id: Stock put into a machine — which.
      reverses_doc_id: A reversal — the document it undoes.
      count_session_id: A count adjustment — the count it comes from.
      device_at: When the phone says it happened. Reports use recorded_at.
      recorded_at: When the server recorded it — the time every rule and report uses.
      request_hash: Fingerprint of the request, to tell a repeat from a different request under the same id.
      is_synthetic: TRUE for demo/test rows.
      correlation_id: Joins it to its audit rows.
    foreign_keys:
      from_location_id:
        references: inv_location.id
        purpose: '"Where did this stock come from?"'
      to_location_id:
        references: inv_location.id
        purpose: '"Where did this stock go?"'
      created_by:
        references: employee.id
        purpose: '"Who recorded this?"'
      confirm_by:
        references: employee.id
        purpose: '"Who must confirm this handover?"'
      answered_by:
        references: employee.id
        purpose: '"Who confirmed or refused it?"'
      settled_by:
        references: employee.id
        purpose: '"Which approver settled it?"'
      machine_id:
        references: machine.id
        purpose: '"Which machine was this stock put into?"'
      reverses_doc_id:
        references: stock_doc.id
        purpose: '"Which document does this reversal undo?" — a self-join on stock_doc.'
      count_session_id:
        references: count_session.id
        purpose: '"Which count did this adjustment come from?"'

  stock_doc_line:
    notes: What a stock document says, item by item (migration 0032) — sent, received, used. Never changed.
    columns:
      doc_id: The document. Part of the primary key.
      item_id: The item. Part of the primary key.
      qty: The amount, in the item's unit.
      variety: A delivery of oranges — the variety on the carton.
      carton_kg: A delivery of oranges — a carton's weight.
    foreign_keys:
      doc_id:
        references: stock_doc.id
        purpose: '"What is on this document?"'
      item_id:
        references: inv_item.id
        purpose: '"Which item, in which unit?"'

  stock_move:
    notes: >
      The ledger (migration 0032): every amount of one item that moved from one place to another, with the step
      of its document (post, send, accept, refuse, cancel, settle_back, write_off, reverse). Append-only — never
      changed or deleted; a mistake is a reversal. Summing a place's moves gives exactly stock_balance.
    columns:
      id: Primary key, in posting order.
      doc_id: The document it belongs to.
      item_id: The item.
      from_location_id: Where it left.
      to_location_id: Where it arrived.
      qty: How much, in the item's unit (always positive).
      step: post | send | accept | refuse | cancel | settle_back | write_off | reverse.
      posted_at: When it was posted.
      posted_by: Who posted it.
      reason: A write-off — damaged_unrecorded | unexplained.
      is_synthetic: TRUE for demo/test rows.
      correlation_id: Joins it to its audit rows.
    foreign_keys:
      doc_id:
        references: stock_doc.id
        purpose: '"Which document moved this?"'
      item_id:
        references: inv_item.id
        purpose: '"Which item moved?"'
      from_location_id:
        references: inv_location.id
        purpose: '"From where?"'
      to_location_id:
        references: inv_location.id
        purpose: '"To where?"'
      posted_by:
        references: employee.id
        purpose: '"Who posted it?"'

  stock_balance:
    notes: >
      What each place holds now, per item (migration 0032) — kept by the ledger's trigger in the same transaction
      as each move, never written directly. Never below zero for a real place (the warehouse, a person, in
      transit). The bookkeeping places' balances are negative mirrors (suppliers — everything ever delivered).
    columns:
      location_id: The place. Part of the primary key.
      item_id: The item. Part of the primary key.
      qty: How much it holds, in the item's unit.
      is_virtual: The place is a bookkeeping place (may be negative).
      updated_at: When it last changed.
    foreign_keys:
      location_id:
        references: inv_location.id
        purpose: '"What does the warehouse hold?" "What does this person hold?"'
      item_id:
        references: inv_item.id
        purpose: '"How many cartons of oranges, where?"'

  count_session:
    notes: >
      A count of the warehouse (migration 0032): opening, after the team left, closing, or a spot check. The
      count screen never shows the record's figure. A difference beyond tolerance is counted again by someone
      else; the Ops Head, the CEO or an Admin decides — never anyone who counted (D218).
    columns:
      id: Primary key — made by the phone or browser.
      location_id: The place counted (the warehouse).
      kind: opening | after_handout | closing | spot.
      state: counting | recount | approval | closed | cancelled.
      started_by: Who counted.
      started_at: When the count was opened.
      submitted_at: When it was handed in.
      recount_by: Who counted again.
      recount_started_at: When the recount was opened.
      recounted_at: When the recount was handed in.
      recount_waived_by: The approver who let the recount go.
      recount_waived_reason: Why.
      decided_by: The approver who decided it.
      decided_at: When.
      decision_note: The approver's words.
      is_synthetic: TRUE for demo/test rows.
      correlation_id: Joins it to its audit rows.
    foreign_keys:
      location_id:
        references: inv_location.id
        purpose: '"Which place was counted?"'
      started_by:
        references: employee.id
        purpose: '"Who counted?"'
      recount_by:
        references: employee.id
        purpose: '"Who counted it again?"'
      recount_waived_by:
        references: employee.id
        purpose: '"Who let the recount go?"'
      decided_by:
        references: employee.id
        purpose: '"Who decided the difference?"'

  count_line:
    notes: >
      One item of a count (migration 0032): what was counted, and what the record said at that moment (never shown
      to the person counting); the recount; the decision. Never changed once handed in.
    columns:
      session_id: The count. Part of the primary key.
      item_id: The item. Part of the primary key.
      counted_qty: What was counted.
      expected_qty: What the record said when the count was handed in.
      moved_during: The item moved while it was being counted, or differed while some of it was on a handover not yet confirmed — the count cannot be read as right (D236).
      recount_qty: What the second person counted.
      recount_expected_qty: What the record said when the recount was handed in.
      recount_moved_during: The same, for the recount.
      decision: accept_count (the count is right; an adjustment was posted) | keep_ledger (the record is right).
      decision_reason: Why it differed — opening_balance | used_unrecorded | damaged_unrecorded | delivery_difference | earlier_miscount | found | unexplained.
    foreign_keys:
      session_id:
        references: count_session.id
        purpose: '"What was counted in this count?"'
      item_id:
        references: inv_item.id
        purpose: '"Which item?"'

  supplier:
    notes: >
      Who delivers to the warehouse (migration 0042) — a company's name, a short code, how many days a delivery takes. No person's
      phone or name is kept here. Deliveries and returns are in wh_order; what each supplier's deliveries were like is a question
      over wh_order and wh_order_line, never a score of a person.
    columns:
      id: Primary key.
      name: The supplier's name, unique (ignoring case).
      code: A short code for labels and lot numbers, unique — FVC, AL-AWIR.
      lead_days: How many days an order usually takes to arrive (0–60).
      note: The company's own words about it.
      active: FALSE once no longer used; its documents stay.
      created_by: Who added it.
      created_at: When.
      updated_at: When it last changed.
      is_synthetic: TRUE for demo/test rows.
    foreign_keys:
      created_by:
        references: employee.id
        purpose: '"Who added this supplier?"'

  wh_number:
    notes: The last number given to each kind of warehouse document in each year (migration 0042) — IN-2026-0007, RET-2026-0002. Bookkeeping only.
    columns:
      kind: receipt | supplier_return. Part of the primary key.
      year: The calendar year in Dubai. Part of the primary key.
      last: The last number given.

  wh_order:
    notes: >
      A planned warehouse document (migration 0042, TASK-086): a receipt expected from a supplier, or a return to the supplier.
      draft → ready → done | cancelled. While draft or ready it moves NO stock; when done it posts an ordinary stock_doc (kind
      receipt or supplier_return) — stock_doc_id — so balances come only from the ledger. A receipt received short leaves a
      backorder (a new receipt whose backorder_of points back) or is closed short. Never changed once done or cancelled.
    columns:
      id: Primary key — made by the phone or browser, so the same request sent twice creates once.
      kind: receipt | supplier_return.
      number: Its human reference, unique — IN-YYYY-NNNN for a receipt, RET-YYYY-NNNN for a return.
      state: draft | ready | done | cancelled.
      supplier_id: The supplier it comes from or goes back to.
      scheduled_on: The Dubai day it is expected (a receipt) or planned (a return).
      priority: normal | urgent.
      source_ref: The supplier's paper — delivery note, order or invoice number.
      vehicle: The truck's plate as written at the gate (a receipt). The plate only.
      note: Free words from the person who made it.
      reason: A return — quality | wrong_item | excess | damaged_on_arrival | expired | other.
      backorder_of: A backorder — the receipt whose missing rest it expects.
      return_of: A return — the received delivery it sends goods back from.
      stock_doc_id: The ledger document posted when it was done (null until then).
      closed_short: Done with less than expected and no backorder — the rest will not come.
      created_by: Who made it.
      created_at: When.
      ready_by: Who marked it ready ("to do").
      ready_at: When.
      done_by: Who received it (or sent it back).
      done_at: When — the time reports use for "received".
      cancelled_by: Who cancelled it.
      cancelled_at: When.
      cancel_note: Why it was cancelled, in their words.
      request_hash: Fingerprint of the request, to tell a repeat from a different request under the same id.
      is_synthetic: TRUE for demo/test rows.
      correlation_id: Joins it to its audit rows.
    foreign_keys:
      supplier_id:
        references: supplier.id
        purpose: '"Which supplier delivered this / receives this return?"'
      backorder_of:
        references: wh_order.id
        purpose: '"Which receipt is this backorder the rest of?" — a self-join on wh_order.'
      return_of:
        references: wh_order.id
        purpose: '"Which delivery is this return from?" — a self-join on wh_order.'
      stock_doc_id:
        references: stock_doc.id
        purpose: '"Which stock document moved this document''s stock?"'
      created_by:
        references: employee.id
        purpose: '"Who made this document?"'
      ready_by:
        references: employee.id
        purpose: '"Who marked it ready?"'
      done_by:
        references: employee.id
        purpose: '"Who received it, or sent it back?"'
      cancelled_by:
        references: employee.id
        purpose: '"Who cancelled it?"'

  wh_order_line:
    notes: >
      Each item of a warehouse document, once (migration 0042): what was expected (or is to go back) and what came (or went), in
      the item's unit, and in kilograms stored as whole grams. Changed only while its document is a draft; what came is written once.
    columns:
      order_id: The document. Part of the primary key.
      item_id: The item. Part of the primary key.
      expected_qty: What is expected (a receipt) or to go back (a return), in the item's unit.
      done_qty: What came (or went back) — set when the document is done.
      expected_g: >
        The delivery note's weight in grams for everything expected (divide by 1000 for kg). To judge the scale, compare done_g
        with the note's weight for what came — round(expected_g * done_qty / expected_qty) — never with expected_g itself: 8 of 10
        cartons are held to 8/10 of the note, or the missing cartons are counted short twice (D285). A line is "lighter" when
        done_g is below that by more than the tolerance (2 %, a placeholder — A-T85.4).
      done_g: The weight on the scale at receiving (or of what went back, on a return), in grams.
      variety: The variety on the carton (oranges).
      best_before: The best-before day on the carton.
      note: Free words about this line.
    foreign_keys:
      order_id:
        references: wh_order.id
        purpose: '"What is on this document?"'
      item_id:
        references: inv_item.id
        purpose: '"Which item, in which unit?"'

  inv_lot:
    notes: >
      A lot (migration 0042): every receipt line received, with its delivery, supplier, day, amount, kilograms (grams) and
      best-before. Written once when the receipt is done; the start of lot tracking — following a lot through hand-outs and
      machines is not recorded yet.
    columns:
      id: Primary key.
      code: Its code, unique — the receipt's number and the line's place in it (IN-2026-0007-1).
      item_id: The item.
      supplier_id: Who delivered it.
      order_id: The receipt it came in.
      stock_doc_id: The ledger document that brought it into the warehouse.
      received_on: The Dubai day it was received.
      best_before: The best-before day on the carton.
      variety: The variety on the carton.
      qty: How much came, in the item's unit.
      weight_g: Its weight on the scale, in grams.
      created_at: When it was recorded.
      is_synthetic: TRUE for demo/test rows.
      correlation_id: Joins it to its audit rows.
    foreign_keys:
      item_id:
        references: inv_item.id
        purpose: '"Which item is this lot of?"'
      supplier_id:
        references: supplier.id
        purpose: '"Which supplier did this lot come from?"'
      order_id:
        references: wh_order.id
        purpose: '"Which receipt brought this lot?"'
      stock_doc_id:
        references: stock_doc.id
        purpose: '"Which stock document moved this lot in?"'

  reorder_rule:
    notes: >
      What to keep in stock (migration 0042): per item and place (the warehouse, or one person's own stock), a minimum and a
      maximum, the pack to order in, the supplier. Only suggests: below the minimum (on hand + already coming), order up to the
      maximum in whole packs. Nothing is ordered or handed out by a rule.
    columns:
      id: Primary key.
      item_id: The item.
      location_id: The warehouse, or a person's own place (inv_location).
      min_qty: Below this, it suggests ordering.
      max_qty: It suggests ordering up to this.
      multiple: The pack size to order in (null — the item's step).
      supplier_id: Whom the warehouse orders it from.
      active: FALSE once no longer used.
      created_by: Who set it.
      created_at: When.
      updated_by: Who last changed it.
      updated_at: When.
      is_synthetic: TRUE for demo/test rows.
    foreign_keys:
      item_id:
        references: inv_item.id
        purpose: '"Which item is this rule for?"'
      location_id:
        references: inv_location.id
        purpose: '"Which place should keep it in stock?"'
      supplier_id:
        references: supplier.id
        purpose: '"Whom is it ordered from?"'
      created_by:
        references: employee.id
        purpose: '"Who set this rule?"'
      updated_by:
        references: employee.id
        purpose: '"Who last changed it?"'

  cash_account:
    notes: >
      A place cash is (migration 0035): a person's hands, a machine's cash box, or where cash went — fuel, other
      expenses, the cash-deposit machine, the bank, over/short. Only a person's account is real cash; the
      others are bookkeeping places. A person's and a machine's account are made the first time cash moves.
    columns:
      id: Primary key. The bookkeeping places have fixed ids (…c001 fuel, …c002 other, …c003 deposited, …c004 bank, …c005 over/short).
      kind: person | machine | fuel | other | cdm | bank | over_short.
      name: The bookkeeping place's name; null for a person's or a machine's (their names are in employee and machine).
      employee_id: A person's account — whose.
      machine_id: A machine's cash box — which machine.
      is_virtual: Not a person's hands — may go below zero (the machines' boxes are negative mirrors of what was collected).
      created_at: When it was made.
      is_synthetic: TRUE for demo/test rows.
    foreign_keys:
      employee_id:
        references: employee.id
        purpose: '"How much cash does this person hold?" (join cash_balance)'
      machine_id:
        references: machine.id
        purpose: '"How much was collected from this machine?"'

  shift:
    notes: >
      One person's shift of handling cash (migration 0035) — the unit the cash auditor checks. Its business date
      is the Dubai date it STARTED: a night shift ending at 07:30 belongs to the day before. Every cash document
      belongs to a shift. One open shift per person.
    columns:
      id: Primary key — made by the phone or browser, so a "start shift" sent twice opens one.
      employee_id: Whose shift.
      started_at: When it started.
      business_date: The Dubai date it started — the day its cash is counted under.
      state: open | closed.
      ended_at: When it ended.
      ended_by: Who ended it — the person, or an auditor for someone who forgot.
      vehicle: The van, as the person typed it.
      audit_outcome: The auditor's check — ok | query (a question waiting for the person's answer); null before it is checked.
      audited_by: Who checked it — never the person whose shift it is.
      audited_at: When.
      audit_note: The auditor's question or remark.
      answer_note: The person's answer to the question, in their words.
      answered_at: When they answered.
      is_synthetic: TRUE for demo/test rows.
      correlation_id: Joins it to its audit rows.
    foreign_keys:
      employee_id:
        references: employee.id
        purpose: '"Whose shift was this?" "Which shifts did this person work?"'
      ended_by:
        references: employee.id
        purpose: '"Who ended this shift?"'
      audited_by:
        references: employee.id
        purpose: '"Who checked this shift''s cash?"'

  cash_doc:
    notes: >
      One cash entry (migration 0035): cash collected from a machine, a test note put back into one, an expense
      (fuel or other), a deposit at the cash-deposit machine, or the undoing of a mistake. Amounts are in fils
      (100 fils = AED 1). Its content never changes; an undone entry is marked reversed and a reversal entry
      posts the opposite move. The amounts that actually moved are in cash_move.
    columns:
      id: Primary key — made by the phone or browser, so the same entry sent twice posts once.
      kind: collection | test_vend | expense | deposit | reversal.
      state: posted | reversed.
      shift_id: The shift it belongs to — the person's open shift when it was made (a reversal, the shift of the entry it undoes).
      created_by: Who made it.
      machine_id: A collection or a test note — which machine.
      amount_fils: The amount in fils, as the person entered it (collected, spent, put back, deposited; a reversal, the amount it undoes). A collection may be 0 — the box was empty.
      expense_kind: An expense — fuel | other.
      litres: Fuel — how many litres, as on the receipt.
      cdm_txn_no: A deposit — the transaction number on the cash-deposit machine's receipt.
      cdm_operator: A deposit — the operator id on the receipt.
      cds_id: A deposit — the CDS id on the receipt.
      bag_no: A deposit — the bag number on the receipt.
      denominations: 'A deposit — the notes by face value in AED, e.g. {"100": 8, "50": 1}; they add up to the amount.'
      receipt_at: The time printed on the receipt (deposit or fuel).
      reason: A reversal — entered_by_mistake | wrong_amount | wrong_machine | duplicate | other.
      note: Free words from the person who made it.
      reverses_doc_id: A reversal — the entry it undoes.
      device_at: When the phone says it was entered. Reports use recorded_at.
      recorded_at: When the server recorded it.
      request_hash: Fingerprint of the request, to tell a repeat from a different request under the same id.
      is_synthetic: TRUE for demo/test rows.
      correlation_id: Joins it to its audit rows.
    foreign_keys:
      shift_id:
        references: shift.id
        purpose: '"What did this person collect, spend and deposit in this shift?"'
      created_by:
        references: employee.id
        purpose: '"Who entered this?"'
      machine_id:
        references: machine.id
        purpose: '"How much cash was collected from this machine?"'
      reverses_doc_id:
        references: cash_doc.id
        purpose: '"Which entry does this reversal undo?" — a self-join on cash_doc.'

  cash_move:
    notes: >
      One movement of cash between two accounts (migration 0035) — what the ledger is made of. Append-only: never
      changed or deleted; a mistake is undone by the opposite move. Each move adds to one account exactly what it
      takes from another, in fils.
    columns:
      id: Primary key.
      doc_id: The entry it belongs to.
      from_account_id: Where the cash came from.
      to_account_id: Where it went.
      fils: How much, in fils — always more than 0.
      step: post | reverse.
      posted_at: When it was posted.
      posted_by: Who posted it.
      is_synthetic: TRUE for demo/test rows.
      correlation_id: Joins it to its audit rows.
    foreign_keys:
      doc_id:
        references: cash_doc.id
        purpose: '"Which entry moved this cash?"'
      from_account_id:
        references: cash_account.id
        purpose: '"From where?"'
      to_account_id:
        references: cash_account.id
        purpose: '"To where?"'
      posted_by:
        references: employee.id
        purpose: '"Who posted it?"'

  cash_balance:
    notes: >
      What each cash account holds now, in fils (migration 0035) — kept by the ledger's trigger in the same
      transaction as each move, never written directly. Never below zero for a person. Bookkeeping accounts are
      negative mirrors (a machine's box: minus everything collected from it).
    columns:
      account_id: The account. Primary key.
      fils: What it holds, in fils.
      is_virtual: A bookkeeping account (may be negative).
      updated_at: When it last changed.
    foreign_keys:
      account_id:
        references: cash_account.id
        purpose: '"How much cash does this person hold now?"'

  route_plan:
    notes: >
      One team's plan for one shift (migration 0036) — the instruction sheet posted to the service team's WhatsApp
      group, block by block ("Team KIRAN/ANANTU - NIGHT SHIFT"). The team is named per plan; who is on it is in
      route_plan_member; the machines and what to do at each are in route_stop.
    columns:
      id: Primary key — made by the planner's browser, so the same plan saved twice is one plan.
      business_date: The day the plan is for (Dubai); a night shift belongs to the day it starts.
      shift_window: day | night.
      name: The team, as the planner names it ("Team Kiran / Ananthu").
      note: The planner's words for the team.
      note_by: Who wrote the note — set when the words change, carried over when the plan is copied (migration 0039); erasure and the person's own download follow it.
      state: active | cancelled.
      copied_from: The plan it was copied from (an earlier day's).
      created_by: Who made it.
      created_at: When.
      updated_by: Who changed it last.
      updated_at: When.
      is_synthetic: TRUE for demo/test rows.
      correlation_id: Joins it to its audit rows.
    foreign_keys:
      copied_from:
        references: route_plan.id
        purpose: '"Which earlier plan was this copied from?" — a self-join on route_plan.'
      created_by:
        references: employee.id
        purpose: '"Who made this plan?"'
      updated_by:
        references: employee.id
        purpose: '"Who changed this plan last?"'
      note_by:
        references: employee.id
        purpose: '"Who wrote this plan''s note?" — whose words they are, for erasure and the person''s own download.'

  route_plan_member:
    notes: Who is on a plan's team (migration 0036). Teams change from day to day, so membership is per plan.
    columns:
      plan_id: The plan. Part of the primary key.
      employee_id: The person on its team. Part of the primary key.
    foreign_keys:
      plan_id:
        references: route_plan.id
        purpose: '"Who is on this team?"'
      employee_id:
        references: employee.id
        purpose: '"Which plans is this person on?"'

  route_stop:
    notes: >
      A machine on a plan (migration 0036): what to do there, in the sheet's words, and the proof wanted (the sheet's
      columns NORMAL PIC, RESORTING PIC, VIDEO OF WHITE FRUIT DISPENSER, OTHER). A stop taken off the plan is kept,
      marked removed, because a visit may already point at it.
    columns:
      id: Primary key — made by the planner's browser.
      plan_id: The plan.
      seq: Its place in the plan's order (1 first).
      machine_id: The machine.
      tasks: What to do, in the sheet's words — full_service, half_service, resort, cash, water_remove, garbage_remove ("kachara remove"), hot_water_clean, deep_clean, free_vend, check (the sheet's 🚨), other.
      crates: Crates of oranges to load here — the sheet's "(2 crates)"; a plan's crates added up are what its team takes from the warehouse.
      instructions: The planner's words for this machine (needed for a check and for "other").
      instructions_by: Who wrote the instructions — set when they change, carried over when the plan is copied (migration 0039).
      evidence: The proof wanted — normal_photo, resorting_photo, dispenser_video, other_photo.
      removed_at: When it was taken off the plan; null while it is on it.
      is_synthetic: TRUE for demo/test rows.
    foreign_keys:
      plan_id:
        references: route_plan.id
        purpose: '"Which machines are on this plan, in order?"'
      machine_id:
        references: machine.id
        purpose: '"Which plans send someone to this machine?"'
      instructions_by:
        references: employee.id
        purpose: '"Who wrote this stop''s instructions?" — whose words they are, for erasure and the person''s own download.'

  visit:
    notes: >
      Someone at a machine (migration 0036): which machine and when — started by its sticker's link (the phone's
      camera read the code) or its number typed in — what was done, and the plan's stop it carries out, if any. It
      records nothing about where anyone is between visits. One open visit per person; never changed once ended.
    columns:
      id: Primary key — made by the phone or browser, so a "start" tapped twice opens one visit.
      machine_id: The machine.
      employee_id: Who visited.
      stop_id: The plan's stop this visit carries out; null for a visit off the plan.
      started_at: When it started (server time).
      started_how: qr (the sticker's link) | typed (the number typed in).
      ended_at: When it ended; null while open.
      tasks_done: What was done, ticked — the same words as route_stop.tasks.
      note: The visitor's words.
      device_at: When the phone says it started. Reports use started_at.
      request_hash: Fingerprint of the request, to tell a repeat from a different request under the same id.
      is_synthetic: TRUE for demo/test rows.
      correlation_id: Joins it to its audit rows.
    foreign_keys:
      machine_id:
        references: machine.id
        purpose: '"Who visited this machine, and when?"'
      employee_id:
        references: employee.id
        purpose: '"Which machines did this person visit?"'
      stop_id:
        references: route_stop.id
        purpose: '"Was this stop of the plan visited?"'

  visit_evidence:
    notes: >
      One photo or video added to a visit as one kind of proof (migration 0036). Taken off (removed_at) while the
      visit was open if it was the wrong one; never swapped. The file itself follows the photo rules: when its
      retention runs out, media_id becomes null and the record that the proof was given stays.
    columns:
      id: Primary key.
      visit_id: The visit.
      kind: normal_photo | resorting_photo | dispenser_video | other_photo.
      media_id: The photo or video; null once the file has gone under the photo rules.
      added_by: Who added it (the visitor).
      added_at: When.
      removed_at: When it was taken off the visit; null while it counts.
      is_synthetic: TRUE for demo/test rows.
    foreign_keys:
      visit_id:
        references: visit.id
        purpose: '"What proof does this visit have?"'
      media_id:
        references: media_object.id
        purpose: '"Which file is this proof?"'
      added_by:
        references: employee.id
        purpose: '"Who added this proof?"'

  visit_doc:
    notes: >
      What a visit put into the machine and took out of it (migration 0036): a stock document (stock used, into this
      machine) or a cash entry (cash collected from it), each on its own ledger. One of the two per row.
    columns:
      visit_id: The visit.
      stock_doc_id: The stock put into the machine (stock_doc), or null.
      cash_doc_id: The cash taken out (cash_doc), or null.
      linked_at: When it was linked.
    foreign_keys:
      visit_id:
        references: visit.id
        purpose: '"What was filled and collected at this visit?"'
      stock_doc_id:
        references: stock_doc.id
        purpose: '"Which visit put this stock into a machine?"'
      cash_doc_id:
        references: cash_doc.id
        purpose: '"At which visit was this cash collected?"'

  analytics_run:
    notes: >
      One build of one day of the analytics store (migration 0038, TASK-071): what it read from the Televend mirror, what it
      wrote, and whether the sales it read equal Televend's own count for the day. A day is built only once the sync has read it
      to its end and checked it; building it again (a late sale arrived) leaves the earlier run here. Answers "where does this
      figure come from?" and "did the store agree with Televend that day?".
    columns:
      id: Primary key.
      kind: What was built — sales_day (the day's rows in sales_day and sales_hour).
      day: The Dubai day built.
      vends_read: How many sales of the day the build read from tv_vend.
      input_synced_through: The newest time one of those sales was stored by the sync — a later sale makes the day be built again.
      cups: Cups written for the day (the sum of sales_day.cups).
      machines: Machine records with sales that day.
      televend_count: Televend's own count of the day's sales, from the run that completed the day; NULL if none was recorded.
      agrees: TRUE when vends_read equals televend_count; NULL without a count.
      status: ok | failed.
      error: Why a build failed.
      started_at: When the build began.
      finished_at: When it ended.
      is_synthetic: TRUE for demo/test rows.
      correlation_id: Links the build to its audit trail and logs.

  sales_day:
    notes: >
      Each Televend machine record's sales on one Dubai day (migration 0038, TASK-071) — the store the analysis, forecasts and
      patterns read. Built from tv_vend for checked days only, so a day missing here was not checked, never "sold nothing". The
      machine's name and region are as Televend had them at the day's last sale: a machine that moved is counted where it stood
      (a new Televend record per move). No personal data. Sum per category with location_caption, per place with machine_tv_id.
    columns:
      day: The Dubai day. Part of the primary key.
      machine_tv_id: The Televend machine record (tv_machine.televend_id). Part of the primary key.
      machine_caption: The machine's Televend name at the day's last sale.
      location_caption: The machine's Televend region at the day's last sale — the category (Hospital / Clinics, Metro, Events …).
      cups: Cups sold that day (the sum of the columns below).
      cash_cups: Cups paid in cash.
      cashless_cups: Cups paid by "Cashless" (card reader 1).
      cashless3_cups: Cups paid by "Cashless 3".
      token_cups: Cups paid with a token (no money at the machine — A-T70.1).
      wallet_cups: Cups paid from Televend's wallet.
      other_cups: Cups paid any other way.
      first_sale_at: The day's first sale.
      last_sale_at: The day's last sale.
      run_id: The build that wrote the row (analytics_run).
      is_synthetic: TRUE for demo/test rows.
    foreign_keys:
      run_id:
        references: analytics_run.id
        purpose: '"Which build wrote this day, from how many sales, and did it agree with Televend?"'

  sales_hour:
    notes: >
      Each Televend machine record's cups per hour of a Dubai day (migration 0038, TASK-071) — for demand by hour (forecasts,
      TASK-079). Hours with no sale have no row. Built with sales_day, from checked days only.
    columns:
      day: The Dubai day. Part of the primary key.
      machine_tv_id: The Televend machine record. Part of the primary key.
      hour: The Dubai hour, 0–23. Part of the primary key.
      cups: Cups sold in that hour (more than 0).
      run_id: The build that wrote the row (analytics_run).
      is_synthetic: TRUE for demo/test rows.
    foreign_keys:
      run_id:
        references: analytics_run.id
        purpose: '"Which build wrote these hours?"'

  tv_day_total:
    notes: >
      Televend's own count of the whole fleet's sales per Dubai day (migration 0038, TASK-071), read from its aggregates — for the
      months before Televend's itemised sales list begins (late March 2026, measured 20 Oct), so long trends (Ramadan, the
      summer) can be seen at fleet level. No per-machine detail.
    columns:
      day: The Dubai day. Primary key.
      vends: Televend's count of sale vends that day across the fleet.
      quantity: Televend's total quantity that day, when given.
      fetched_at: When it was read.
      is_synthetic: TRUE for demo/test rows.
      correlation_id: Links the read to its run.

  role_capability:
    notes: What each access role may do — one row per (role, capability). The SQL copy of permissions.ts, read by app_has_capability() inside the read policies; a test fails the build if the two differ. Changed only by a migration. Answers "who may see the Televend data?" or "may an Ops Head give work?" — never use it to judge a person.
    columns:
      role: An employee.access_role value (ceo, admin, ops_head, …). Part of the primary key.
      capability: What the role may do, e.g. data.read_all, work.give_to_reports, televend.read. Part of the primary key.

  device:
    notes: A phone the staff app runs on (migration 0028, TASK-058) — a company phone shared across shifts, or a personal phone that belongs to one person. Enrolled by the CEO or an Admin; it proves itself with a secret only it holds. A custody item, not a record of anyone's work. Read by the CEO and Admins, and by the owner of a personal phone.
    columns:
      id: Primary key; the phone sends it on every call.
      kind: company (shared, one person signed in at a time) | personal (one person's own phone).
      label: What people call it, e.g. "Van 4 phone".
      bound_employee_id: For a personal phone, the person it belongs to; NULL for a company phone.
      platform: What the phone said it runs (android), when enrolled.
      model: The phone model it reported, when enrolled.
      app_version: The app version it reported, when enrolled.
      secret_hash: sha256 of the phone's secret. The secret itself is only on the phone.
      enrolled_by: Who created the enrolment code it used (the CEO or an Admin).
      enrolled_at: When it was enrolled.
      last_seen_at: When it last called the API (updated at most once a minute).
      locked_until: Too many wrong PINs or wrong set-up codes on this phone — it is refused until then.
      revoked_at: When it was switched off (lost, replaced, or its enrolment code was used twice). NULL while it works.
      revoked_by: Who switched it off.
      revoke_reason: Why, in words.
      is_synthetic: TRUE for demo/test rows.
      correlation_id: Joins the enrolment to its audit rows.
    foreign_keys:
      bound_employee_id:
        references: employee.id
        purpose: '"Whose personal phone is this?" — the only person who may be set up on it.'
      enrolled_by:
        references: employee.id
        purpose: '"Who enrolled this phone?" — for the custody record and investigations.'
      revoked_by:
        references: employee.id
        purpose: '"Who switched this phone off?"'

  device_enrolment:
    notes: A one-time code that turns a phone into an enrolled phone (shown as a QR, valid minutes). Only a keyed hash of the code is stored. Read by the CEO and Admins.
    columns:
      id: Primary key.
      code_hash: HMAC of the code with a key only the API holds — a copy of the database cannot be used to guess it.
      kind: company | personal — what the phone will be.
      label: The name the phone will carry.
      bound_employee_id: For a personal phone, its person.
      created_by: Who created the code (the CEO or an Admin).
      created_at: When.
      expires_at: After this the code no longer works.
      used_at: When a phone used it; a second use switches that phone off.
      device_id: The phone that used it.
      is_synthetic: TRUE for demo/test rows.
      correlation_id: Joins it to its audit rows.
    foreign_keys:
      bound_employee_id:
        references: employee.id
        purpose: '"Whose phone will this code enrol?"'
      created_by:
        references: employee.id
        purpose: '"Who handed out this enrolment code?"'
      device_id:
        references: device.id
        purpose: '"Which phone used this code?" — and so which phone to switch off if it is used again.'

  app_setup_code:
    notes: A one-time code that sets one person up to sign in on a phone (they choose their PIN with it). Valid hours; a new one voids the person's earlier unused ones. Issued by the CEO, an Admin or the person's own lead. Only a keyed hash is stored. Read by the CEO and Admins.
    columns:
      id: Primary key.
      employee_id: The person it sets up.
      code_hash: HMAC of the code with a key only the API holds.
      created_by: Who issued it.
      created_at: When.
      expires_at: After this it no longer works.
      used_at: When it was used.
      used_on_device: The phone it was used on.
      voided_at: When a newer code for the same person replaced it unused.
      is_synthetic: TRUE for demo/test rows.
      correlation_id: Joins it to its audit rows.
    foreign_keys:
      employee_id:
        references: employee.id
        purpose: '"Who does this code set up?" — a code can only ever set up that person.'
      created_by:
        references: employee.id
        purpose: '"Who issued this set-up code?" — the CEO, an Admin or the person''s lead.'
      used_on_device:
        references: device.id
        purpose: '"On which phone was this person set up?"'

  app_credential:
    notes: One person set up on one phone — a hash of a random secret the phone keeps for them, and their PIN as a salted, peppered, slow hash (scrypt). Both are needed to sign in. Wrong PINs are counted here, slowed down from the fifth, and the tenth in a row disables it until the person is set up again. Purpose is account security only — never attendance or performance (D210). Read by the CEO and Admins and by the person themself.
    columns:
      id: Primary key.
      device_id: The phone.
      employee_id: The person.
      secret_hash: sha256 of the secret the phone keeps for this person.
      pin_hash: The PIN's scrypt hash, written scrypt$logN$r$p$salt$hash, over an HMAC of the PIN with the pepper (kept outside the database).
      pin_set_at: When the PIN was set or last changed.
      created_at: When the person was set up on this phone.
      setup_code_id: The set-up code that did it.
      failed_count: Wrong PINs in a row since the last good sign-in. A security counter — never a measure of the person.
      last_failed_at: When the last wrong PIN was entered.
      locked_until: From the fifth wrong PIN in a row, no try before this.
      disabled_at: When it was stopped (ten wrong PINs in a row, or twenty in thirty days); a new set-up code is needed.
      disabled_reason: Why, in words.
      revoked_at: When it was removed (set up again, phone switched off, or removed by the person, their lead, an Admin or the CEO).
      revoked_by: Who removed it.
      last_signed_in_at: The last good sign-in — kept for security investigations, not shown as a timeline.
      is_synthetic: TRUE for demo/test rows.
      correlation_id: Joins it to its audit rows.
    foreign_keys:
      device_id:
        references: device.id
        purpose: '"Who is set up on this phone?"'
      employee_id:
        references: employee.id
        purpose: '"On which phones can this person sign in?" (their data export).'
      setup_code_id:
        references: app_setup_code.id
        purpose: '"Which code set this person up here, and who issued it?"'
      revoked_by:
        references: employee.id
        purpose: '"Who removed this sign-in?"'

  app_session:
    notes: A signed-in person on a phone — an opaque 15-minute access token and a refresh token, both stored only as hashes, rotated together on every refresh. A refresh token presented twice ends its whole family. On a company phone a sign-in ends at the next shift handover. Rows ended or expired more than 30 days ago are deleted. Read by the CEO and Admins and by the person themself.
    columns:
      id: Primary key; one access/refresh pair.
      family_id: Every pair descended from one sign-in.
      credential_id: The credential that signed in.
      device_id: The phone.
      employee_id: The person.
      access_hash: sha256 of the access token.
      access_expires_at: When the access token stops working (15 minutes after issue).
      refresh_hash: sha256 of the refresh token.
      created_at: When this pair was issued.
      expires_at: The family's hard end — the next shift handover (+30 min) on a company phone, 30 days on a personal one.
      idle_until: The end if the phone goes quiet (an hour on a company phone, a week on a personal one).
      used_at: When this pair's refresh token was exchanged.
      replaced_by: The pair it was exchanged for.
      revoked_at: When the family was ended (sign-out, another person signed in on the phone, reuse, phone switched off).
      revoke_reason: Why, in words.
      is_synthetic: TRUE for demo/test rows.
      correlation_id: Joins it to its audit rows.
    foreign_keys:
      credential_id:
        references: app_credential.id
        purpose: '"Which sign-in on which phone is this session?"'
      device_id:
        references: device.id
        purpose: '"Who is signed in on this phone right now?"'
      employee_id:
        references: employee.id
        purpose: '"Where is this person signed in?" — to end it, never to time their work.'
      replaced_by:
        references: app_session.id
        purpose: >
          SELF-REFERENTIAL. The pair a refresh token was exchanged for: following replaced_by from a pair
          walks its family forward, which is how a reused token is told from a retried one.

  bot_session:
    notes: Which question the Telegram bot is mid-way through for one chat. Not employee data — only a conversation pointer — and safe to delete to unstick someone. Every actual answer is written to its own table as it arrives.
    columns:
      key: grammY session key (chat/user scoped). Primary key.
      value: jsonb holding the current conversation step.
      updated_at: When the step last changed.

  schema_migrations:
    notes: Ledger of which migration files have been applied. Never edit — deleting a row makes a migration re-run and corrupt the schema.
    columns:
      version: Supabase's own migration version string; unused by this project's runner.
      name: The migration file that was applied, e.g. "0014_privilege_hardening.sql".
      applied_at: When it ran.
